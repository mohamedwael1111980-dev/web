<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>quiestions</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: subject cards on a home grid -> quiz opens as a single-column question stage with a sticky progress bar */
:root{
  --bg:#eef1f5; --surface:#ffffff; --ink:#131c28; --muted:#5b6778; --line:#d6dce5;
  --accent:#2b4bff; --accent-ink:#ffffff; --accent-soft:#e3e8ff;
  --ok:#0e7a4b; --ok-soft:#dcf3e8; --bad:#b4261e; --bad-soft:#fbe4e1;
  --font-ui:'IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f151e; --surface:#18212d; --ink:#e8edf4; --muted:#93a0b3; --line:#2a3646;
  --accent:#7d93ff; --accent-ink:#0f151e; --accent-soft:#222c52;
  --ok:#52d397; --ok-soft:#14352a; --bad:#ff8a80; --bad-soft:#40201e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151e; --surface:#18212d; --ink:#e8edf4; --muted:#93a0b3; --line:#2a3646;
  --accent:#7d93ff; --accent-ink:#0f151e; --accent-soft:#222c52;
  --ok:#52d397; --ok-soft:#14352a; --bad:#ff8a80; --bad-soft:#40201e; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.7;
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto;position:relative;z-index:1}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:none}
#bg.on{display:block}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono)}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:20px 8px}
.brand{font-weight:700;font-size:15px;color:var(--muted);letter-spacing:.02em}
.back{background:none;border:1.5px solid var(--line);border-radius:999px;padding:9px 22px;font-size:17px;font-weight:600;color:var(--ink)}
.back:hover{border-color:var(--accent);color:var(--accent)}

/* home */
h1{font-size:clamp(28px,6vw,40px);line-height:1.25;margin:28px 0 6px;font-weight:700;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 28px}
.subject{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:grid;gap:18px}
.subject-head{display:flex;gap:16px;align-items:center}
.sym{flex:none;width:56px;height:56px;border-radius:14px;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;font-family:var(--font-mono);font-weight:500;font-size:22px;direction:ltr}
.subject h2{margin:0;font-size:22px;line-height:1.3;direction:ltr;text-align:left}
.subject .sub{margin:0;color:var(--muted);font-size:14px}
.quizlist{display:grid;gap:10px}
.subj-btn{cursor:pointer;display:flex;align-items:center;justify-content:space-between;text-align:left;width:100%;gap:12px}
.subj-btn:hover{border-color:var(--accent)}
.subj-btn .h2{display:block;font-size:22px;font-weight:700;line-height:1.3;direction:ltr;text-align:left}
.subj-btn .sub{display:block}
.subj-btn .doc{display:block;font-size:13px;font-weight:400;line-height:1.4;color:var(--muted);opacity:.7;direction:ltr;text-align:left;margin-top:1px}
#list{display:grid;gap:16px;margin-top:6px}
.qhead{margin-top:14px}
.qcard{scroll-margin-top:160px}
.quizbtn{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;width:100%;
  background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.quizbtn:hover{border-color:var(--accent)}
.quizbtn b{font-family:var(--font-mono);font-weight:500;font-size:18px;direction:ltr}
.quizbtn.all{border-color:var(--accent);background:var(--accent-soft)}
.quizbtn span{color:var(--muted);font-size:14px}
.pill{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 12px;font-size:13px;font-weight:600;white-space:nowrap}

.hero{margin:clamp(12px,5vh,48px) 0 clamp(28px,6vh,56px);text-align:center;font-size:clamp(32px,9vw,68px);line-height:1.05;font-weight:700;letter-spacing:-.02em;direction:ltr;user-select:none;cursor:default}
.hero{-webkit-tap-highlight-color:transparent;-webkit-user-select:none}
.hero .ch{display:inline-block;will-change:transform}
/* progress */
.prog{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:10px 12px;z-index:5}
.prog-top{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:8px;font-variant-numeric:tabular-nums}
.track{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.fill{height:100%;background:var(--accent);width:0;transition:width .3s}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;direction:ltr;justify-content:flex-start}
.dot{min-width:28px;height:28px;border-radius:7px;background:var(--line);color:var(--ink);border:0;padding:0;font-family:var(--font-mono);font-size:12px;font-weight:500;font-variant-numeric:tabular-nums}
.dot.ok,.dot.bad{color:#fff}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)}
.dot.cur{outline:2px solid var(--accent);outline-offset:1px}

.dm{background:none;border:1px solid var(--line);border-radius:999px;padding:0 12px;font-size:12px;line-height:22px;color:var(--ink);font-family:var(--font-mono)}
.dm:hover{border-color:var(--accent);color:var(--accent)}
.tools{display:flex;gap:8px;margin-top:10px;direction:ltr;flex-wrap:nowrap}
.tools .dm{white-space:nowrap;text-align:center}
#restartBtn{min-width:92px}
.tools{margin:14px 0 4px}
.tools .dm{flex:none;line-height:1.2;padding:6px 14px;font-size:13px;font-weight:600;border-radius:999px;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tools .dm:hover{filter:brightness(1.08);color:var(--accent-ink)}
.tools .dm.warn,.tools .dm.warn:hover{border-color:var(--bad);color:var(--bad);background:var(--bad-soft);filter:none}
.hide-ex .ex-body{display:none}
.dots.row{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.dots.row .dot{flex:none}
/* question */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
#final .qcard{margin-top:16px}
.qnum{font-family:var(--font-mono);font-size:13px;color:var(--muted);direction:ltr;text-align:left;margin-bottom:8px}
.qtext{direction:ltr;text-align:left;font-size:19px;line-height:1.55;font-weight:500;margin:0 0 20px;overflow-wrap:anywhere}
.blank{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--accent);margin-inline:3px;transform:translateY(-3px)}
.opts{display:grid;gap:10px;direction:ltr}
.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--bg);
  border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:17px;overflow-wrap:anywhere}
.opt .k{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  font-family:var(--font-mono);font-size:14px;background:var(--surface);border:1px solid var(--line);font-weight:500}
.opt:not(:disabled):hover{border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.faded{opacity:.55}
.opt .mark{margin-left:auto;font-size:13px;font-weight:600;font-family:var(--font-ui)}
.opt.right .mark{color:var(--ok)} .opt.wrong .mark{color:var(--bad)}

/* explanation */
.explain{margin-top:18px;border-radius:14px;border:1px solid var(--line);background:var(--bg);overflow:hidden}
.verdict{direction:ltr;padding:12px 18px;font-weight:700;font-size:17px}
.explain.good .verdict{background:var(--ok-soft);color:var(--ok)}
.explain.miss .verdict{background:var(--bad-soft);color:var(--bad)}
.ex-body{padding:6px 18px 16px;display:grid;gap:14px;direction:rtl;text-align:right}
.ex-body h3{margin:12px 0 2px;font-size:13px;letter-spacing:.04em;color:var(--muted);font-weight:600}
.ex-body p{margin:0;max-width:62ch}
.ex-body code,.ex-body bdi{font-family:var(--font-mono);font-size:.92em;background:var(--accent-soft);color:var(--accent);padding:1px 6px;border-radius:5px;direction:ltr;unicode-bidi:isolate}
.next{margin-top:18px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:12px 22px;font-weight:600;background:var(--accent);color:var(--accent-ink);font-size:16px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn:hover{filter:brightness(1.08)}

/* result */
.score{font-family:var(--font-mono);font-size:64px;line-height:1.1;direction:ltr;font-weight:500;margin:6px 0}
.review{display:grid;gap:8px;margin-top:20px}
.rv{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.rv .n{flex:none;font-family:var(--font-mono);width:28px;height:28px;display:grid;place-items:center;border-radius:7px;color:var(--surface);font-size:13px}
.rv.ok .n{background:var(--ok)} .rv.bad .n{background:var(--bad)}
.rv span{direction:ltr;text-align:left;flex:1;min-width:0;overflow-wrap:anywhere}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}

/* ===== Mobile fit: الصفحة الرئيسية تتحط في شاشة الموبايل من غير سكرول، والباقي مقاساته مظبوطة ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-wrap:anywhere}
button,.dot{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.wrap{min-width:0;width:100%}
.subj-btn>.subject-head{min-width:0;flex:1}
@media (max-width:600px){
  body{font-size:15px;line-height:1.6;padding-block:0 20px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  .bar{padding-block:10px 2px}
  .brand{font-size:13px}
  .back{padding:8px 18px;font-size:16px}
  h1{font-size:24px;margin:14px 0 4px}
  .hero{font-size:clamp(30px,10.5vw,46px);margin:max(26px,env(safe-area-inset-top,0px)) 0 18px}
  .quizlist{gap:8px}
  .subject{padding:12px 14px;border-radius:14px;gap:0}
  .subject-head{gap:12px}
  .sym{width:42px;height:42px;font-size:16px;border-radius:10px}
  .subj-btn .h2{font-size:17px}
  .subj-btn .sub{font-size:12px}
  .pill{padding:2px 10px;font-size:12px}
  .quizbtn{padding:11px 13px;gap:8px}
  .quizbtn b{font-size:15px}
  .quizbtn span{font-size:12.5px}
  .prog{padding-block:6px 8px}
  .prog-top{font-size:12.5px;margin-bottom:6px}
  .dot{min-width:26px;height:26px;font-size:11px}
  #list{gap:12px}
  .qcard{padding:14px;border-radius:14px}
  .qtext{font-size:16.5px;margin-bottom:14px}
  .opts{gap:8px}
  .opt{font-size:15px;padding:9px 11px;gap:10px}
  .opt .k{width:26px;height:26px;font-size:13px}
  .opt .mark{font-size:11.5px}
  .verdict{padding:10px 14px;font-size:15px}
  .ex-body{padding:4px 14px 12px;gap:10px}
  .ex-body p{font-size:14.5px}
  .btn{padding:10px 16px;font-size:15px}
  .score{font-size:46px}
}
/* نفس مقاسات الموبايل لما المتصفح يكون على Desktop site */
html.m body{font-size:15px;line-height:1.6;padding-block:0 20px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
html.m .bar{padding-block:10px 2px}
html.m .brand{font-size:13px}
html.m .back{padding:8px 18px;font-size:16px}
html.m h1{font-size:24px;margin:14px 0 4px}
html.m .hero{font-size:clamp(30px,10.5vw,46px);margin:max(26px,env(safe-area-inset-top,0px)) 0 18px}
html.m .quizlist{gap:8px}
html.m .subject{padding:12px 14px;border-radius:14px;gap:0}
html.m .subject-head{gap:12px}
html.m .sym{width:42px;height:42px;font-size:16px;border-radius:10px}
html.m .subj-btn .h2{font-size:17px}
html.m .subj-btn .sub{font-size:12px}
html.m .pill{padding:2px 10px;font-size:12px}
html.m .quizbtn{padding:11px 13px;gap:8px}
html.m .quizbtn b{font-size:15px}
html.m .quizbtn span{font-size:12.5px}
html.m .prog{padding-block:6px 8px}
html.m .prog-top{font-size:12.5px;margin-bottom:6px}
html.m .dot{min-width:26px;height:26px;font-size:11px}
html.m #list{gap:12px}
html.m .qcard{padding:14px;border-radius:14px}
html.m .qtext{font-size:16.5px;margin-bottom:14px}
html.m .opts{gap:8px}
html.m .opt{font-size:15px;padding:9px 11px;gap:10px}
html.m .opt .k{width:26px;height:26px;font-size:13px}
html.m .opt .mark{font-size:11.5px}
html.m .verdict{padding:10px 14px;font-size:15px}
html.m .ex-body{padding:4px 14px 12px;gap:10px}
html.m .ex-body p{font-size:14.5px}
html.m .btn{padding:10px 16px;font-size:15px}
html.m .score{font-size:46px}
@media (max-width:600px) and (max-height:680px){
  .hero{font-size:clamp(26px,9vw,38px);margin:2px 0 10px}
  .subject{padding:9px 12px}
  .sym{width:36px;height:36px;font-size:14px}
  .subj-btn .h2{font-size:16px}
}

/* زرار الرجوع لأول الصفحة */
.opt svg{width:130px;max-width:100%;height:auto;display:block;flex:none}
.tblw{overflow-x:auto;margin:0 0 14px;direction:ltr}
.tbl{border-collapse:collapse;width:100%;max-width:420px;font-size:14px;text-align:center}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 10px}
.tbl th{background:rgba(120,130,150,.15);font-weight:600}
.tbl tbody tr:nth-child(even){background:rgba(120,130,150,.07)}
#toTop{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:30;width:60px;height:60px;padding:0;border-radius:50%;
  border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 4px 16px rgba(0,0,0,.3);
  opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .2s,transform .2s;touch-action:manipulation}
#toTop.show{opacity:1;pointer-events:auto;transform:none}
#toTop:active{filter:brightness(.92)}
#toTop svg{width:30px;height:30px;display:block}
@media (prefers-reduced-motion:reduce){#toTop{transition:none}}
</style>

<script>

 ar:"التوحيد القياسي (Standardization) بيتأثر بالقيم الشاذة (outliers) بدرجة ...............",

const NS3=[
M("For the bisection method to be applicable on an interval [a,b], which condition is generally required for a continuous function?",["f(a) = f(b)","f(a)·f(b) > 0","f(a)·f(b) < 0","f'(a) = f'(b)"],2,"عشان طريقة التنصيف (Bisection) تتطبق على الفترة [a,b]، إيه الشرط المطلوب عادةً لدالة متصلة؟","الشرط هو <code>f(a)·f(b) &lt; 0</code>، يعني الدالة <b>إشارتها مختلفة</b> عند طرفي الفترة. وبما إن الدالة متصلة، فبالتأكيد بتقطع محور x في نقطة جوه الفترة (نظرية القيمة المتوسطة)، يعني فيه جذر.","لو <code>f(a)·f(b) &gt; 0</code> يبقى الإشارتين زي بعض ومش مضمون وجود جذر. والشرطين التانيين مالهمش علاقة بوجود الجذر."),
M("For f(x) = x² − 4, consider the interval [1, 3]. The first bisection approximation is:",["1","2","2.5","3"],1,"للدالة f(x) = x² − 4 على الفترة [1, 3]، أول تقريب بطريقة التنصيف هو:","أول تقريب هو نقطة المنتصف: <code>(1 + 3) / 2 = 2</code>. وكمان <code>f(2) = 0</code> يعني 2 هو الجذر بالظبط.","1 و 3 هما طرفا الفترة، مش نقطة المنتصف."),
M("Consider f(x) = x² − 9. If Newton–Raphson starts with x₀ = 4, what is the next approximation?",["3","3.125","3.5","4.125"],1,"للدالة f(x) = x² − 9 لو بدأنا Newton–Raphson بـ x₀ = 4، إيه التقريب اللي بعده؟","القانون: <code>x₁ = x₀ − f(x₀)/f'(x₀)</code>. هنا <code>f(4) = 16 − 9 = 7</code> و <code>f'(x) = 2x</code> فـ <code>f'(4) = 8</code>. يبقى <code>x₁ = 4 − 7/8 = 3.125</code>.","الرقم 3 هو الجذر الحقيقي، لكن أول تكرار مش بيوصله مباشرةً، بيقرّب منه بس."),
M("Which method can generally converge rapidly without requiring a bracketing interval, provided the initial guess is suitable?",["Bisection","False position","Newton–Raphson","All methods require bracketing intervals"],2,"أي طريقة ممكن تتقارب بسرعة من غير ما تحتاج فترة تحصر الجذر (bracketing interval) بشرط يكون التخمين المبدئي مناسب؟","<b>Newton–Raphson</b> بتحتاج نقطة بداية واحدة بس (مش فترة)، وتقاربها سريع (تربيعي) لو التخمين قريب من الجذر.","الـ Bisection والـ False Position الاتنين محتاجين فترة <code>[a,b]</code> فيها تغيّر إشارة."),
M("For f(x) = x³ − 2, with initial guess x₀ = 1, what is the first Newton–Raphson approximation?",["1.5000","1.1111","0.6667","1.3333"],3,"للدالة f(x) = x³ − 2 بتخمين مبدئي x₀ = 1، إيه أول تقريب بـ Newton–Raphson؟","<code>f(1) = 1 − 2 = −1</code> و <code>f'(x) = 3x²</code> فـ <code>f'(1) = 3</code>. يبقى <code>x₁ = 1 − (−1)/3 = 1 + 1/3 = 1.3333</code>.","لاحظ إن <code>f(x₀)</code> سالبة، فبنطرح رقم سالب يعني بنزوّد، وعشان كده التقريب أكبر من 1."),
M("For f(x) = x³ − 4, the initial interval is [1, 2]. What is the first midpoint?",["2.0","1.25","1.75","1.5"],3,"للدالة f(x) = x³ − 4 والفترة المبدئية [1, 2]، إيه أول نقطة منتصف؟","<code>(1 + 2) / 2 = 1.5</code>.","2.0 هو الطرف الأيمن للفترة، و 1.25 و 1.75 نقط منتصف لفترات أصغر بتيجي في التكرارات اللي بعد كده."),
M("For f(x) = x² − 16 on [2, 5], the first midpoint is 3.5. Which interval should be retained?",["[2, 3.5]","[2, 5]","[3.5, 5]","[2, 3]"],2,"للدالة f(x) = x² − 16 على الفترة [2, 5] وأول نقطة منتصف 3.5، أي فترة نحتفظ بيها؟","نحسب: <code>f(3.5) = 12.25 − 16 = −3.75</code> (سالبة)، و <code>f(5) = 25 − 16 = 9</code> (موجبة). الإشارة بتتغير بين 3.5 و 5، فنحتفظ بالفترة <code>[3.5, 5]</code> (الجذر الحقيقي هو 4).","الفترة <code>[2, 3.5]</code> الاتنين فيها قيم سالبة (<code>f(2) = −12</code>) يعني مفيش تغيّر إشارة فمفيش جذر مضمون."),
M("Which formula is used to calculate the root approximation in the False Position method?",["x = (a + b) / 2","x = (a·f(b) − b·f(a)) / (f(b) − f(a))","x = a + b","x = 0"],1,"أي قانون بيُستخدم لحساب تقريب الجذر في طريقة الموضع الخاطئ (False Position)؟","القانون هو <code>x = (a·f(b) − b·f(a)) / (f(b) − f(a))</code>. ده نقطة تقاطع الخط المستقيم الواصل بين <code>(a, f(a))</code> و <code>(b, f(b))</code> مع محور x.","القانون <code>(a + b)/2</code> ده بتاع Bisection."),
M("For f(a) = −2 and f(b) = 6, where a = 1 and b = 3, what is the first False Position approximation?",["3.0","2.0","1.5","2.5"],2,"لو f(a) = −2 و f(b) = 6 حيث a = 1 و b = 3، إيه أول تقريب بـ False Position؟","نعوّض في القانون: <code>x = (1·6 − 3·(−2)) / (6 − (−2)) = (6 + 6) / 8 = 12/8 = 1.5</code>.","لو استخدمنا منتصف الفترة (طريقة Bisection) هنجيب 2.0، لكن False Position بتعتمد على قيم الدالة فبتقرب من الطرف اللي قيمته أصغر في المقدار (هنا f(a))."),
M("For a continuous function, which condition is normally required for the False Position method to bracket a root?",["f(a) = f(b)","f(a)·f(b) > 0","f(a)·f(b) < 0","f'(a) = f'(b)"],2,"لدالة متصلة، إيه الشرط المطلوب عادةً عشان False Position تحصر الجذر؟","نفس شرط Bisection: <code>f(a)·f(b) &lt; 0</code>، يعني إشارة الدالة مختلفة عند الطرفين فالجذر محصور بينهم.","لو الحاصل موجب يبقى الإشارتين زي بعض ومفيش ضمان لوجود جذر في الفترة."),
];

M("What is the block size when the relevant subnet-mask octet is 192?",["32","64","128","192"],1,"إيه الـ block size لما الـ octet المهم في الـ subnet mask قيمته 192؟","الـ block size = <code>256 − 192 = 64</code>."),
M("How many usable host addresses are available in a /24 subnet?",["128","254","256","510"],1,"كام عنوان host قابل للاستخدام في subnet بـ /24؟","<code>/24</code> يعني 8 host bits، فالعدد = <code>2⁸ − 2 = 254</code>.","الـ 256 هو إجمالي العناوين بدون استبعاد الشبكة والـ broadcast."),
M("Which address is the broadcast address for the subnet 192.168.5.32/27?",["192.168.5.32","192.168.5.33","192.168.5.62","192.168.5.63"],3,"أي عنوان هو الـ broadcast للـ subnet 192.168.5.32/27؟","الـ <code>/27</code> الـ block size بتاعها 32، فالـ subnet من <code>.32</code> لـ <code>.63</code>، والـ broadcast هو <b>192.168.5.63</b>.","الـ .32 هو عنوان الشبكة، و .33 أول host، و .62 آخر host."),
M("Which subnet mask corresponds to the prefix length /26?",["255.255.255.0","255.255.255.192","255.255.255.224","255.255.255.128"],1,"أي subnet mask بيقابل الـ prefix length /26؟","<code>/26</code> = 2 bits في الـ octet الأخير: <code>11000000</code> = 192، فالـ mask هو <code>255.255.255.192</code>.","255.255.255.224 هي /27، و 255.255.255.128 هي /25."),
M("How many usable host addresses are available in a /28 subnet?",["6","14","16","30"],1,"كام عنوان host قابل للاستخدام في subnet بـ /28؟","<code>/28</code> يعني 4 host bits، فالعدد = <code>2⁴ − 2 = 14</code>.","الـ 16 هو إجمالي العناوين، والـ 30 لـ /27."),
M("What is the network address of 192.168.1.140/26?",["192.168.1.0","192.168.1.64","192.168.1.128","192.168.1.192"],2,"إيه عنوان الشبكة للعنوان 192.168.1.140/26؟","الـ block size = 64، والـ subnets: <code>.0, .64, .128, .192</code>. الرقم 140 بين 128 و 191 فعنوان الشبكة <b>192.168.1.128</b>."),
M("How many host bits are available in an IPv4 address with prefix /20?",["8","12","20","32"],1,"كام host bit متاح في عنوان IPv4 بـ prefix /20؟","الـ host bits = <code>32 − 20 = 12</code>.","الـ 20 هو عدد الـ network bits مش الـ host bits."),
M("Which statement about a broadcast address is correct?",["All host bits are set to 0","All network bits are set to 1","All host bits are set to 1","It is always the first address in a subnet"],2,"أي عبارة عن عنوان الـ broadcast صحيحة؟","عنوان الـ broadcast كل <b>الـ host bits</b> فيه بتبقى <b>1</b>، وهو آخر عنوان في الـ subnet.","الـ host bits كلها 0 ده عنوان الشبكة (network address) وهو أول عنوان."),
];

/* ===== Operations Research ===== */
const OR1=[
M("What does a constraint represent in an optimization problem?",["A decision variable","The goal of the problem","The optimal solution","A limitation or requirement on resources"],3,"إيه اللي بيمثّله الـ constraint (القيد) في مسألة optimization؟","الـ <b>constraint</b> هو <b>حد أو شرط على الموارد</b> (زي ساعات العمل أو الخامات المتاحة)، وهو اللي بيحدد المنطقة المسموح نختار منها الحل.","المتغير القراري هو اللي بنتحكم فيه، والهدف هو الـ objective function."),
M("In OR, what does \"optimization\" mean?",["Finding any solution","Finding the best solution among all feasible alternatives","Making the problem more complex","Ignoring constraints"],1,"في الـ OR، إيه معنى الـ \"optimization\"؟","معناها <b>إيجاد أفضل حل من بين كل البدائل الممكنة (feasible)</b>، يعني أعلى ربح أو أقل تكلفة مع احترام القيود.","إيجاد أي حل مش كفاية، لازم يكون الأفضل، وتجاهل القيود غلط."),
M("Which of the following best describes a mathematical model in OR?",["A computer hardware component","A random guess about the future","A physical replica of a real system","A simplified representation of a real-world problem using mathematical relationships"],3,"أي وصف أنسب للنموذج الرياضي (mathematical model) في الـ OR؟","النموذج الرياضي هو <b>تمثيل مبسّط لمشكلة حقيقية باستخدام علاقات رياضية</b> (معادلات ومتباينات).","النسخة الفيزيائية المصغّرة دي physical model مش mathematical model."),
M("A company must produce at least 20 units of Product A and at least 30 units of Product B. Which set of constraints represents this?",["A + B ≥ 50","A ≥ 30, B ≥ 20","A ≤ 20, B ≤ 30","A ≥ 20, B ≥ 30"],3,"شركة لازم تنتج على الأقل 20 وحدة من المنتج A وعلى الأقل 30 وحدة من B. أي مجموعة قيود بتمثّل ده؟","\"على الأقل\" يعني <code>≥</code>، فالقيود هي <code>A ≥ 20</code> و <code>B ≥ 30</code>.","الاختيار <code>A + B ≥ 50</code> بيسمح مثلاً بـ 50 وحدة من A وصفر من B، وده بيخالف شرط الحد الأدنى لكل منتج لوحده."),
M("What is the primary goal of Operations Research?",["To maximize the number of variables","To eliminate all constraints in a system","To replace human decision-makers","To support better decision-making using analytical methods"],3,"إيه الهدف الأساسي لبحوث العمليات (OR)؟","الهدف هو <b>دعم اتخاذ قرارات أفضل باستخدام طرق تحليلية</b>.","الـ OR مش بتستبدل متخذ القرار، وبتتعامل مع القيود مش بتلغيها."),
M("Which step of the OR methodology comes immediately after \"Solve Model\"?",["Identify Variables","Validate Model","Define Problem","Implement Solution"],1,"أنهي خطوة في منهجية الـ OR بتيجي مباشرةً بعد \"Solve Model\"؟","بعد حل النموذج بتيجي خطوة <b>Validate Model</b> (التحقق من النموذج) عشان نتأكد إنه بيعكس الواقع، وبعدها الـ Implement.","Define Problem و Identify Variables بيجوا في الأول، والتنفيذ بيجي بعد التحقق."),
M("Which of the following is a correct general form of an LP objective function?",["Maximize Z = X₁ × X₂ × ⋯ × Xₙ","Maximize Z = c₁X₁ + c₂X₂ + ⋯ + cₙXₙ","Maximize Z = X₁² + X₂²","Maximize Z = log(X₁) + log(X₂)"],1,"أي صيغة من دول هي الصيغة العامة الصحيحة لدالة الهدف في الـ LP؟","الـ LP لازم تكون <b>خطية</b>: <code>Z = c₁X₁ + c₂X₂ + … + cₙXₙ</code>، يعني مجموع متغيرات مضروبة في معاملات.","الضرب والتربيع واللوغاريتم مش خطية فمش مقبولين في Linear Programming."),
M("In OR, what is an objective function?",["A non-negativity restriction","A mathematical expression to be maximized or minimized","A constraint that limits resources","A decision variable"],1,"في الـ OR، إيه هي الـ objective function؟","هي <b>تعبير رياضي بنحاول نكبّره (maximize) أو نصغّره (minimize)</b>، زي الربح أو التكلفة.","القيود والـ non-negativity والمتغيرات القرارية عناصر تانية في النموذج."),
M("What is a decision variable in an LP model?",["The objective function","The unknown quantity the decision-maker controls","A fixed constant","A constraint"],1,"إيه هو الـ decision variable في نموذج LP؟","هو <b>الكمية المجهولة اللي متخذ القرار بيتحكم فيها</b> (زي عدد الوحدات اللي هننتجها من كل منتج).","الثوابت زي الربح للوحدة أو الموارد المتاحة بتبقى معطاة، مش متغيرات قرارية."),
M("A company produces chairs and tables. Each chair requires 2 units of wood and each table requires 5 units of wood. There are 200 units of wood available. If C = number of chairs and T = number of tables, which constraint is correct?",["2C + 5T ≤ 200","5C + 2T ≤ 200","C + T ≤ 200","2C + 5T ≥ 200"],0,"الكرسي محتاج 2 وحدة خشب والترابيزة 5 وحدات، والمتاح 200 وحدة. أي قيد صح؟","الخشب المستخدم = <code>2C + 5T</code> ولازم ميزيدش عن المتاح، فالقيد <code>2C + 5T ≤ 200</code>.","القيد <code>≥</code> غلط لأن المورد حد أقصى مش حد أدنى، ومعاملات الكرسي والترابيزة متبدلة في الاختيار B."),
M("Which of the following is a benefit of using OR?",["It provides a framework for handling complex, large-scale problems","It guarantees perfect decisions every time","It eliminates all uncertainty","It requires no data"],0,"أي من دول فايدة من استخدام الـ OR؟","من فوايدها إنها بتوفر <b>إطار منظم للتعامل مع المشاكل المعقدة والكبيرة</b>.","الـ OR مش بتضمن قرارات مثالية ولا بتلغي عدم اليقين، وبتحتاج بيانات."),
M("A company produces two products, X and Y. Each unit of X gives a profit of $5 and each unit of Y gives a profit of $8. The company wants to maximize profit. What is the objective function?",["Maximize Z = 8X + 5Y","Minimize Z = 5X + 8Y","Maximize Z = 5X + 8Y","Maximize Z = X + Y"],2,"المنتج X ربحه 5$ للوحدة، والمنتج Y ربحه 8$ للوحدة، والشركة عايزة تعظّم الربح. إيه دالة الهدف؟","الربح الكلي = <code>5X + 8Y</code> وعايزين نكبّره، فالدالة <code>Maximize Z = 5X + 8Y</code>.","في الاختيار A المعاملات متبدلة، وفي B استخدم Minimize وده غلط لأن الهدف تعظيم الربح."),
M("A company wants to minimize cost. Product X costs $4 per unit and Product Y costs $7 per unit. What is the objective function?",["Maximize Z = 4X + 7Y","Minimize Z = 4X + 7Y","Maximize Z = X + Y","Minimize Z = 7X + 4Y"],1,"شركة عايزة تقلل التكلفة. المنتج X تكلفته 4$ والمنتج Y تكلفته 7$. إيه دالة الهدف؟","التكلفة الكلية = <code>4X + 7Y</code> وعايزين نصغّرها، فالدالة <code>Minimize Z = 4X + 7Y</code>.","الاختيار D معاملاته متبدلة."),
M("A factory has 100 hours of labor available. Product A requires 2 hours per unit and Product B requires 3 hours per unit. Which constraint represents this?",["A + B ≤ 100","2A + 3B ≤ 100","2A + 3B ≥ 100","3A + 2B ≤ 100"],1,"المصنع عنده 100 ساعة عمل. المنتج A محتاج 2 ساعة للوحدة، و B محتاج 3 ساعات. أي قيد صح؟","ساعات العمل المستخدمة = <code>2A + 3B</code> ولازم ميزيدش عن 100، فالقيد <code>2A + 3B ≤ 100</code>.","الاختيار D معاملاته متبدلة، و C اتجاه المتباينة فيه غلط."),
M("Which of the following is a limitation of OR models?",["They are simplifications and may not fit real-world assumptions perfectly","They do not require any data","They cannot handle any constraints","They are always 100% accurate"],0,"أي من دول قيد (limitation) على نماذج الـ OR؟","نماذج الـ OR <b>تبسيط للواقع</b>، فمش بالضرورة بتطابق افتراضات الواقع بشكل كامل.","النماذج بتتعامل مع القيود وبتحتاج بيانات ومش دقيقة 100%."),
M("A company produces two products, A and B, with profits $10 and $15. If X₁ and X₂ are the quantities produced, what is the objective function to maximize profit?",["Maximize Z = 10X₁ + 15X₂","Minimize Z = 10X₁ + 15X₂","Maximize Z = 15X₁ + 10X₂","Maximize Z = X₁ + X₂"],0,"شركة بتنتج A و B بربح 10$ و 15$. لو X₁ و X₂ هما الكميات المنتجة، إيه دالة الهدف لتعظيم الربح؟","X₁ بتقابل المنتج A (ربحه 10) و X₂ بتقابل B (ربحه 15)، فالدالة <code>Maximize Z = 10X₁ + 15X₂</code>.","الاختيار C معاملاته متبدلة، و B بيصغّر بدل ما يكبّر."),
M("What does a feasible region represent in a linear programming problem?",["The objective function value","The set of all optimal solutions","The set of all possible solutions that satisfy all constraints","The cost of resources"],2,"إيه اللي بتمثّله الـ feasible region في مسألة LP؟","هي <b>مجموعة كل الحلول الممكنة اللي بتحقق كل القيود مع بعض</b>.","مش بالضرورة كلها حلول مثلى، الحل الأمثل بس نقطة (أو أكتر) جواها."),
M("In linear programming, what is meant by \"linearity\"?",["Variables have powers greater than 1","Relationships involve logarithms or exponents","Relationships between variables are strictly proportional (degree of 1)","Variables are independent of each other"],2,"في الـ LP، إيه معنى الـ \"linearity\"؟","معناها إن العلاقات بين المتغيرات <b>تناسبية تماماً (من الدرجة الأولى)</b>، يعني المتغير مرفوع للأس 1 ومفيش ضرب بين متغيرات.","القوى الأكبر من 1 واللوغاريتمات والأسس علاقات غير خطية."),
M("What is the purpose of the non-negativity constraints (X₁, X₂ ≥ 0) in linear programming?",["To increase the profit","To limit available resources","To ensure that decision variables cannot take negative values","To make the problem nonlinear"],2,"إيه الغرض من قيود عدم السالبية (X₁, X₂ ≥ 0) في الـ LP؟","الغرض هو <b>التأكد إن المتغيرات القرارية مش بتاخد قيم سالبة</b>، لأن الكميات المنتجة مش ممكن تبقى سالبة.","مالهاش علاقة بزيادة الربح أو تحديد الموارد، وبتحافظ على خطية المسألة."),
M("What is an optimal solution in linear programming?",["Any solution inside the feasible region","A solution that violates at least one constraint","A feasible solution that yields the best (maximum or minimum) objective function value","A solution where all variables are zero"],2,"إيه هو الحل الأمثل (optimal solution) في الـ LP؟","هو <b>حل feasible بيدّي أفضل قيمة (أعلى أو أقل) لدالة الهدف</b>.","أي حل جوه المنطقة مش بالضرورة أمثل، والحل اللي بيخالف قيد مش feasible أصلاً."),
];

const OR2=[
M("If a linear programming problem has multiple optimal solutions, what is true about the objective function line?",["It is parallel to one of the constraint lines","It passes through the origin","It is perpendicular to one of the constraint lines","It does not touch the feasible region"],0,"لو مسألة LP ليها حلول مثلى متعددة، إيه الصح عن خط دالة الهدف؟","بيكون <b>موازي لأحد خطوط القيود</b>، فلما نحركه لحد آخر نقطة بيطابق ضلع كامل من المنطقة، وكل نقطة على الضلع ده حل أمثل.","مش شرط يعدّي بنقطة الأصل، ولو مماسش المنطقة مفيش حل أصلاً."),
M("What is the primary limitation of the graphical method for solving linear programming problems?",["It is limited to problems with only two decision variables","It can only solve maximization problems","It cannot handle non-negativity constraints","It requires the simplex method to find the final answer"],0,"إيه القيد الأساسي على الطريقة البيانية (graphical method) لحل الـ LP؟","الطريقة البيانية <b>مقتصرة على المسائل اللي فيها متغيرين قراريين بس</b>، لأننا بنرسم على محورين.","بتحل التعظيم والتقليل الاتنين، وبتتعامل مع قيود عدم السالبية عادي."),
M("Which of the following is NOT an assumption of linear programming models?",["Divisibility","Additivity","Uncertainty","Proportionality"],2,"أي من دول مش افتراض من افتراضات نماذج الـ LP؟","الـ LP بتفترض <b>التأكد (Certainty)</b> يعني القيم معلومة وثابتة، فـ <b>Uncertainty</b> مش افتراض.","الافتراضات هي: Proportionality و Additivity و Divisibility و Certainty."),
M("An infeasible linear programming problem is one where:",["No solution satisfies all constraints simultaneously","There are multiple optimal solutions","The feasible region is unbounded","The objective function can increase indefinitely"],0,"المسألة الـ infeasible في الـ LP هي اللي:","هي المسألة اللي <b>مفيش فيها أي حل بيحقق كل القيود مع بعض</b>، يعني مفيش feasible region.","الحلول المتعددة المثلى حالة تانية، وعدم الحدود (unbounded) برضه حالة تانية."),
M("In the simplex method, what does a surplus variable represent?",["An excess above a constraint requirement level","An unused resource","A negative decision variable","The objective function value"],0,"في طريقة السمبلكس، إيه اللي بيمثّله الـ surplus variable؟","الـ <b>surplus variable</b> بيمثّل <b>الزيادة فوق الحد الأدنى المطلوب</b> في قيد من نوع <code>≥</code>.","الموارد غير المستخدمة هي الـ slack variable في قيود <code>≤</code>."),
M("In the simplex method, what is the \"pivot element\"?",["The intersection of the pivot column and pivot row","The smallest ratio in the ratio test","The RHS value of the pivot row","The largest value in the pivot column"],0,"في طريقة السمبلكس، إيه هو الـ \"pivot element\"؟","هو <b>العنصر عند تقاطع الـ pivot column مع الـ pivot row</b>.","أصغر نسبة في الـ ratio test بتحدد الـ pivot row بس، مش هي العنصر نفسه."),
M("When solving a minimization problem graphically, the optimal solution is found by:",["Finding the corner point with the highest Z value","Finding the point where the objective function line is farthest from the origin","Finding the corner point with the lowest Z value","Finding the center of the feasible region"],2,"لما نحل مسألة minimization بيانياً، بنلاقي الحل الأمثل عن طريق:","بنختار <b>الـ corner point اللي قيمة Z فيه أقل ما يمكن</b>.","أعلى قيمة لـ Z بنختارها في التعظيم مش التقليل."),
M("In a simplex tableau, a basic variable is one that:",["Has a non-zero value in the current solution","Is set to zero","Is not in the objective function","Has a column with all zeros"],0,"في جدول السمبلكس، الـ basic variable هو المتغير اللي:","هو المتغير اللي <b>له قيمة غير صفرية في الحل الحالي</b> (موجود في الـ basis).","المتغيرات المضبوطة على صفر هي الـ non-basic variables."),
M("A simplex tableau for a maximization problem has the following Z-row coefficients: x1: 0, x2: −2, x3: 0, s1: 3, s2: 0. What is the next entering variable?",["x1","x2","s2","s1"],1,"جدول سمبلكس لمسألة maximization معاملات صف Z فيه: x1: 0، x2: −2، x3: 0، s1: 3، s2: 0. إيه المتغير الداخل (entering variable) التالي؟","في التعظيم بنختار المتغير صاحب <b>أكتر معامل سالب</b> في صف Z، والمعامل السالب الوحيد هنا هو <code>−2</code> للمتغير <b>x2</b>.","المعاملات الصفرية والموجبة (زي s1: 3) مش بتتحسن بإدخالها."),
M("A test has two types of questions: Type A is worth 10 points and takes 4 minutes, Type B is worth 20 points and takes 8 minutes. The total time allowed is 80 minutes. If x is the number of Type A questions and y is the number of Type B questions, which constraint represents the time limit?",["10x + 20y ≤ 80","4x + 8y ≤ 80","8x + 4y ≤ 80","4x + 8y ≥ 80"],1,"اختبار فيه نوعين أسئلة: النوع A بـ 10 درجات ووقته 4 دقايق، والنوع B بـ 20 درجة ووقته 8 دقايق. الوقت الكلي 80 دقيقة. أي قيد بيمثّل حد الوقت؟","الوقت المستخدم = <code>4x + 8y</code> ولازم ميزيدش عن 80، فالقيد <code>4x + 8y ≤ 80</code>.","الاختيار A بيستخدم الدرجات بدل الدقايق، و C معاملاته متبدلة."),
M("A farmer wants to minimize the cost of fertilizer. Brand X costs $5 per bag and Brand Y costs $8 per bag. What is the objective function?",["Maximize Z = 5X + 8Y","Maximize Z = X + Y","Minimize Z = 8X + 5Y","Minimize Z = 5X + 8Y"],3,"مزارع عايز يقلل تكلفة السماد. الماركة X بـ 5$ للكيس والماركة Y بـ 8$. إيه دالة الهدف؟","التكلفة الكلية = <code>5X + 8Y</code> وعايزين نصغّرها، فالدالة <code>Minimize Z = 5X + 8Y</code>.","في الاختيار C معاملات X و Y متبدلة."),
M("Consider a maximization LP with constraints x ≤ 10, y ≤ 8, and x + y ≤ 15. Which of the following points is NOT a corner point of the feasible region?",["(7, 8)","(10, 8)","(10, 0)","(0, 0)"],1,"مسألة تعظيم قيودها <code>x ≤ 10</code> و <code>y ≤ 8</code> و <code>x + y ≤ 15</code>. أي نقطة مش corner point في الـ feasible region؟","الـ corner points هي: <code>(0,0)</code> و <code>(10,0)</code> و <code>(10,5)</code> و <code>(7,8)</code> و <code>(0,8)</code>. النقطة <code>(10,8)</code> مجموعها 18 وده أكبر من 15 يعني بتخالف القيد الثالث وده بيخليها خارج المنطقة."),
M("An unbounded solution in a linear programming problem means that:",["The objective function can increase (or decrease) indefinitely without reaching a maximum (or minimum)","The feasible region is a closed polygon","There is no feasible region","The problem has multiple optimal solutions"],0,"الحل الـ unbounded في مسألة LP معناه إن:","معناه إن <b>دالة الهدف ممكن تزيد (أو تقل) للأبد من غير ما توصل لحد أقصى (أو أدنى)</b>، وده بيحصل لما المنطقة مفتوحة في اتجاه التحسين.","المنطقة المقفولة (closed polygon) دايماً ليها حل، وعدم وجود منطقة ده infeasible."),
M("A solution that satisfies all constraints of a linear programming model is called:",["A feasible solution","An infeasible solution","An unbounded solution","An optimal solution"],0,"الحل اللي بيحقق كل قيود نموذج الـ LP بيتسمى:","بيتسمى <b>feasible solution</b> (حل مقبول).","الـ optimal هو أفضل feasible solution، مش أي واحد."),
M("Which of the following best describes the primary limitation of an Operations Research model?",["It requires no data to function","It is a simplification and may not perfectly capture real-world complexity","It guarantees a perfect solution every time","It is always too expensive to build"],1,"أي وصف أنسب للقيد الأساسي على نموذج الـ OR؟","النموذج <b>تبسيط للواقع</b> فممكن مايعكسش تعقيداته بالكامل.","النماذج بتحتاج بيانات ومش بتضمن حل مثالي دايماً، وتكلفتها مش دايماً عالية."),
M("A furniture company makes tables (T) and chairs (C). Each table requires 4 units of wood and each chair requires 1 unit. There are 60 units of wood available. The company must produce at least 5 tables. Which of the following is the correct set of constraints?",["4T + C ≤ 60, T ≥ 5","T + 4C ≤ 60, T ≤ 5","4T + C ≥ 60, T ≥ 5","4T + C ≤ 60, T ≤ 5"],0,"شركة أثاث بتعمل ترابيزات (T) وكراسي (C). الترابيزة محتاجة 4 وحدات خشب والكرسي 1، والمتاح 60 وحدة، ولازم تنتج على الأقل 5 ترابيزات. أي مجموعة قيود صح؟","قيد الخشب: <code>4T + C ≤ 60</code> (حد أقصى)، وقيد الإنتاج: <code>T ≥ 5</code> (\"على الأقل\" يعني ≥).","الاختيارات التانية فيها معاملات متبدلة أو اتجاه متباينة غلط."),
M("When is the optimal solution reached in the simplex method for a maximization problem?",["When all coefficients in the Z-row are non-negative","When the RHS column is all positive","When all coefficients in the Z-row are non-positive","When all coefficients in the Z-row are zero"],0,"إمتى بيتوصل للحل الأمثل في السمبلكس لمسألة maximization؟","لما <b>كل معاملات صف Z تبقى غير سالبة (≥ 0)</b>، يعني مفيش معامل سالب تاني نقدر نحسّن بيه.","طالما فيه معامل سالب لسه فيه تحسين ممكن (المتغير ده يدخل)."),
M("A company produces two products, A and B. Each unit of A requires 3 hours of labor and each unit of B requires 2 hours. There are 120 hours of labor available. Which constraint represents this?",["3A + 2B ≤ 120","2A + 3B ≤ 120","A + B ≤ 120","3A + 2B ≥ 120"],0,"الوحدة من A محتاجة 3 ساعات عمل ومن B ساعتين، والمتاح 120 ساعة. أي قيد بيمثّل ده؟","ساعات العمل المستخدمة = <code>3A + 2B</code> ولازم ميزيدش عن 120، فالقيد <code>3A + 2B ≤ 120</code>.","الاختيار B معاملاته متبدلة."),
M("In the graphical method, the optimal solution to a linear programming problem is always found at:",["The origin (0,0)","Any point on the boundary of the feasible region","The center of the feasible region","A corner point (extreme point) of the feasible region"],3,"في الطريقة البيانية، الحل الأمثل لمسألة LP بيتلاقي دايماً عند:","الحل الأمثل بيكون دايماً عند <b>corner point (extreme point)</b> من الـ feasible region.","مش شرط يكون الأصل، ومش أي نقطة على الحدود، ومش المركز."),
M("What does the \"non-negativity\" restriction in a linear programming model imply?",["All decision variables must be integers","All constraints must be less than or equal to zero","All decision variables must be greater than or equal to zero","The objective function must be positive"],2,"إيه اللي بيعنيه قيد \"non-negativity\" في نموذج LP؟","بيعني إن <b>كل المتغيرات القرارية لازم تكون أكبر من أو تساوي صفر</b>.","مش بيشترط إنها أعداد صحيحة، ومش بيخص القيود أو إشارة دالة الهدف."),
M("In a simplex tableau for a maximization problem, how is the entering variable (pivot column) selected?",["The column with the smallest ratio","The column with the most negative coefficient in the Z-row","The column with the most positive coefficient in the Z-row","The column with the largest RHS value"],1,"في جدول السمبلكس لمسألة maximization، إزاي بيتحدد المتغير الداخل (pivot column)؟","بنختار العمود صاحب <b>أكتر معامل سالب في صف Z</b>.","أصغر نسبة بتستخدم لتحديد الصف (المتغير الخارج) مش العمود."),
M("In the OR methodology, what is the primary purpose of the \"Validate Model\" step?",["To find the optimal solution using algorithms","To identify the decision variables","To ensure the model accurately reflects the real-world problem","To apply the solution to the actual system"],2,"في منهجية الـ OR، إيه الغرض الأساسي من خطوة \"Validate Model\"؟","الغرض هو <b>التأكد إن النموذج بيعكس المشكلة الحقيقية بدقة</b>.","إيجاد الحل بالخوارزميات هو Solve Model، وتطبيق الحل على النظام هو Implement."),
M("A company must produce at least 15 units of Product X and no more than 40 units of Product Y. Which set of constraints represents this?",["X ≤ 15, Y ≥ 40","X ≥ 15, Y ≥ 40","X ≤ 15, Y ≤ 40","X ≥ 15, Y ≤ 40"],3,"شركة لازم تنتج على الأقل 15 وحدة من X وعلى الأكتر 40 وحدة من Y. أي مجموعة قيود صح؟","\"على الأقل 15\" يعني <code>X ≥ 15</code>، و\"على الأكتر 40\" يعني <code>Y ≤ 40</code>.","باقي الاختيارات بتعكس اتجاه واحد أو الاتنين."),
M("What is the minimum ratio test used for in the simplex method?",["To determine the leaving variable","To calculate the objective function value","To determine the entering variable","To check for optimality"],0,"الـ minimum ratio test بيُستخدم لإيه في السمبلكس؟","بيُستخدم <b>لتحديد المتغير الخارج (leaving variable)</b> أي الـ pivot row.","المتغير الداخل بيتحدد من صف Z، والتحقق من الأمثلية بيتم بمعاملات صف Z."),
M("What is the primary purpose of adding a slack variable to a \"≤\" constraint in the simplex method?",["Both representing an excess above a requirement and converting the inequality into an equation","To represent an excess above a requirement","To convert the inequality into an equation","To represent unused resource"],2,"إيه الغرض الأساسي من إضافة slack variable لقيد من نوع \"≤\" في السمبلكس؟","الغرض الأساسي هو <b>تحويل المتباينة لمعادلة</b>، لأن السمبلكس بيشتغل على معادلات.","الـ slack بيمثّل برضه الموارد غير المستخدمة، لكن الإجابة المعتمدة في الشيت هي تحويل المتباينة لمعادلة. أما \"الزيادة فوق الحد المطلوب\" فده الـ surplus."),
];

/* ===== Numerical: sheet 4 (Fixed Point Iteration - MCQ on Lecture 5) ===== */
const NS4=[
M("The Fixed Point Iteration method is used to solve:",["Linear equations only", "Nonlinear equations", "Differential equations only", "Matrix equations"],1,"طريقة التكرار للنقطة الثابتة (Fixed Point Iteration) بتُستخدم لحل:","الـ Fixed Point Iteration طريقة عددية لحل <b>المعادلات غير الخطية (Nonlinear equations)</b> زي <code>x³ + x − 1 = 0</code> أو <code>cos x = x</code>، بنقرّب الجذر بتكرار حسابات متتالية.","المعادلات الخطية ليها طرق مباشرة (زي Gauss)، والمعادلات التفاضلية والمصفوفات ليها طرق تانية."),
M("The general form of a fixed-point equation is:",["f(x)=0", "x=g(x)", "x=f'(x)", "g(x)=0"],1,"الصيغة العامة لمعادلة النقطة الثابتة (fixed-point equation) هي:","الصيغة هي <code>x = g(x)</code>: المتغير في طرف، ودالة منه في الطرف التاني. الحل بيبقى النقطة اللي لما نعوّض بيها في <code>g</code> بترجع لنفسها.","<code>f(x) = 0</code> هي الصيغة الأصلية للمعادلة قبل ما نحوّلها لصيغة <code>x = g(x)</code>."),
M("A fixed point is a value of (x) that satisfies:",["f(x)=1", "g(x)=0", "g(x)=x", "g'(x)=0"],2,"النقطة الثابتة (fixed point) هي قيمة x اللي بتحقق:","النقطة الثابتة هي اللي <code>g(x) = x</code>، يعني الدالة <b>مبتغيّرهاش</b>، بتدّي نفس القيمة اللي دخلتلها.","<code>g(x) = 0</code> ده جذر الدالة g مش نقطة ثابتة، و<code>g'(x) = 0</code> بيتعلق بالمشتقة."),
M("Which of the following is the correct iteration formula?",["xn+1=f(xn)", "xn+1=g(xn)", "xn+1=xn+g(xn)", "xn+1=g'(xn)"],1,"أي صيغة من دول هي صيغة التكرار (iteration) الصح؟","صيغة التكرار هي <code>x<sub>n+1</sub> = g(x<sub>n</sub>)</code>: بناخد القيمة القديمة ونعوّض بيها في <code>g</code> عشان نجيب القيمة الجديدة.","مفيش حد <code>x<sub>n</sub> +</code> زيادة قبل <code>g</code>، ولا بنستخدم مشتقة <code>g'</code> في الصيغة نفسها (المشتقة بنستخدمها بس في اختبار التقارب)."),
M("The initial approximation in Fixed Point Iteration is usually denoted by:",["x0", "xn+1", "g'(x)", "f(x)"],0,"التقريب الابتدائي (initial approximation) في Fixed Point Iteration بيتكتب عادةً بالرمز:","التخمين الأول بنسميه <code>x<sub>0</sub></code>، ومنه بنحسب <code>x<sub>1</sub> = g(x<sub>0</sub>)</code> وهكذا.","<code>x<sub>n+1</sub></code> هو التقريب الجاي، و<code>f(x)</code> و<code>g'(x)</code> دوال مش قيم ابتدائية."),
M("If |g'(x)|>1 near the fixed point, the iteration is generally:",["Convergent", "Divergent", "Always accurate", "Constant"],1,"لو |g'(x)| > 1 قريب من النقطة الثابتة، التكرار غالباً بيكون:","شرط التقارب إن <code>|g'(x)| &lt; 1</code>. لو أكبر من 1 الخطأ بيتكبّر في كل خطوة، فالتكرار <b>divergent (متباعد)</b> وبيبعد عن الجذر.","مفيش تقارب مضمون ولا دقة، والتكرار مش بيثبت على قيمة."),
M("If g'(x)=0.5 near the fixed point, the iteration is:",["Generally convergent", "Generally divergent", "Impossible to calculate", "Always oscillatory"],0,"لو g'(x) = 0.5 قريب من النقطة الثابتة، التكرار بيكون:","<code>|0.5| &lt; 1</code> يعني الشرط متحقق، فالتكرار <b>غالباً convergent (متقارب)</b>. وكل خطوة بتصغّر الخطأ تقريباً للنص.","القيمة موجبة فالتقارب بيكون من ناحية واحدة (monotonic) مش متذبذب. التذبذب بيحصل لو المشتقة سالبة."),
M("The Fixed Point Iteration method stops when:",["The error becomes sufficiently small", "The initial value becomes zero", "The derivative becomes greater than one", "The number of iterations is always one"],0,"طريقة Fixed Point Iteration بتقف لما:","بنوقف لما <b>الخطأ يبقى صغير كفاية</b> (أقل من الـ tolerance)، يعني الفرق بين <code>x<sub>n+1</sub></code> و<code>x<sub>n</sub></code> يبقى صغير جداً.","لو المشتقة بقت أكبر من 1 ده معناه إن التكرار بيتباعد، مش سبب إيقاف طبيعي. وعدد التكرارات مش دايماً واحد."),
M("Given g(x)=(x+2)/3 and x0=1, calculate x1.",["0", "1", "2", "3"],1,"لو g(x) = (x+2)/3 و x0 = 1، احسب x1.","<code>x<sub>1</sub> = g(x<sub>0</sub>) = (1 + 2)/3 = 3/3 = 1</code>. وده منطقي لأن <code>x = 1</code> هي نفسها النقطة الثابتة: <code>(x+2)/3 = x ⟹ x = 1</code>.","لأن x0 هي نفسها النقطة الثابتة، كل التكرارات هتفضل 1."),
M("Given g(x)=√(2 + x) and x0=2, calculate x1.",["1", "2", "3", "4"],1,"لو g(x) = √(2 + x) و x0 = 2، احسب x1.","<code>x<sub>1</sub> = g(2) = √(2 + 2) = √4 = 2</code>. هنا كمان x0 هي النقطة الثابتة: <code>√(2+x) = x ⟹ x = 2</code>.","الدالة المكتوبة في الـ PDF بتظهر بشكل مش واضح، والتفسير √(2+x) هو اللي بيدّي إجابة موجودة في الاختيارات."),
M("The equation f(x)=0 can be converted into fixed-point form by:",["Rearranging it into x=g(x)", "Differentiating it twice", "Integrating it", "Multiplying both sides by zero"],0,"المعادلة f(x) = 0 ممكن نحوّلها لصيغة النقطة الثابتة عن طريق:","بنـ<b>عيد ترتيب</b> المعادلة عشان نعزل x في طرف: مثلاً <code>x² − x − 2 = 0</code> ممكن تبقى <code>x = x² − 2</code> أو <code>x = √(x + 2)</code>. وفيه أكتر من ترتيب، وبعضهم بيتقارب وبعضهم لأ.","التفاضل والتكامل بيغيّروا المعادلة نفسها، والضرب في صفر بيخلّيها <code>0 = 0</code> وتضيع المعلومة."),
];

/* ===== Operations Research: quiz 3 (من ملف LP_Questions_Answers.pdf) ===== */
const OR3=[
M("What are decision variables in linear programming?",["Variables that define the problem's solution", "Constants used in constraints", "The outcome of the objective function", "The profit values in optimization"],0,"إيه هي المتغيرات القراريّة (decision variables) في الـ linear programming؟","الـ <b>decision variables</b> هي المتغيرات اللي إحنا بنتحكم فيها وبنختار قيمتها، وقيمتها النهائية هي <b>اللي بتحدد الحل</b> (مثلاً: هننتج كام وحدة من كل منتج). بنرمزلها غالباً بـ <code>x1, x2, ...</code>","الثوابت في القيود دي الـ <code>RHS</code> (الطرف الأيمن)، وقيمة دالة الهدف هي الـ <code>Z</code> نفسه، وأرباح الوحدة دي معاملات (coefficients) في دالة الهدف مش متغيرات."),
M("The simplex method computations require............",["All the variables are nonnegative", "All the constraints are equations with a nonnegative right-hand side", "All of them", "None of them"],2,"حسابات طريقة السمبلكس (simplex) بتتطلب ............","السمبلكس محتاج الشرطين مع بعض: <b>كل المتغيرات غير سالبة</b> (<code>xi ≥ 0</code>)، و<b>كل القيود تبقى معادلات</b> والطرف الأيمن (RHS) غير سالب. عشان كده بنضيف slack وsurplus، وبنضرب في <code>-1</code> لو الـ RHS سالب. فالإجابة <b>All of them</b>.","الاختيار الأول والتاني كل واحد صح، بس الاتنين مطلوبين مع بعض، فالإجابة الشاملة هي All of them."),
M("An unbounded solution typically indicates:",["Missing constraints in the model", "Infeasibility", "Degeneracy in the solution", "A unique optimal solution"],0,"الحل غير المحدود (unbounded solution) غالباً بيدل على إيه؟","لما الـ feasible region تبقى مفتوحة ودالة الهدف تقدر تزيد (أو تقل) للأبد، ده معناه إن <b>فيه قيود ناقصة في النموذج</b> (غالباً نسينا قيد على مورد معين). في الواقع مفيش حاجة بتزيد للأبد.","الـ infeasibility معناها مفيش حل أصلاً (القيود متعارضة)، والـ degeneracy حاجة تانية (basic variable قيمته صفر). ومفيش حل أمثل وحيد في حالة الـ unbounded."),
M("In the graphical LP, the feasible region in LP is determined by ...............",["Random choice of variables", "Unbounded solutions", "Objective function alone", "Intersection of all constraints"],3,"في الحل البياني للـ LP، منطقة الحلول الممكنة (feasible region) بتتحدد بـ ...............","الـ feasible region هي <b>تقاطع (intersection) كل القيود</b> مع بعض (بما فيها قيود عدم السالبية)، يعني النقط اللي بتحقق كل القيود في نفس الوقت.","دالة الهدف لوحدها بتحدد اتجاه التحسين اللي بنتحرك فيه عشان نلاقي الحل الأمثل، لكن مش هي اللي بتحدد المنطقة."),
M("What are non-basic variables in a simplex tableau?",["Surplus and slack variables", "Variables contributing to the objective function directly", "Variables that are always zero in the current solution", "All variables with positive coefficients"],2,"إيه هي المتغيرات غير الأساسية (non-basic variables) في جدول السمبلكس؟","الـ <b>non-basic variables</b> هي المتغيرات اللي <b>قيمتها صفر في الحل الحالي</b> (مش موجودة في الـ basis). ولو واحد منهم دخل الـ basis في iteration جاية قيمته بتتغير من الصفر.","الـ slack والـ surplus ممكن يكونوا basic أو non-basic حسب الـ iteration، فمش دايماً non-basic."),
M("When is a solution classified as infeasible?",["If at least one artificial variable is positive in the optimum iteration", "When all constraints are equalities", "When alternative optima exist", "When no artificial variable is used"],0,"إمتى الحل بيتصنّف إنه infeasible؟","في طريقة الـ <code>Big-M</code> أو <code>Two-Phase</code>، لو في آخر iteration (الأمثل) لسه فيه <b>artificial variable واحد على الأقل قيمته موجبة</b> يبقى المسألة <b>infeasible</b> (مفيش حل بيحقق كل القيود)، لأن الـ artificial مش جزء من المسألة الأصلية.","وجود قيود معادلات أو alternative optima مش معناه infeasible، وعدم استخدام artificial variable معناه إننا مش محتاجينها أصلاً."),
M("What are slack variables used for in linear programming?",["To convert inequalities into equalities", "To increase the number of constraints", "To minimize the objective function", "To represent dual solutions"],0,"الـ slack variables بتتستخدم في الـ LP لإيه؟","الـ <b>slack variable</b> بنضيفه لقيد من نوع <code>≤</code> عشان <b>نحوّله لمعادلة</b>، وبيمثّل الجزء غير المستخدم من المورد. مثال: <code>x1 + x2 ≤ 10</code> بتبقى <code>x1 + x2 + s1 = 10</code>.","السمبلكس بيشتغل على معادلات، والـ slack مش بيزوّد عدد القيود ولا بيقلل دالة الهدف."),
M("What is meant by the term 'optimality condition' in the simplex method?",["The first pivot operation is complete", "No negative coefficients remain in the objective function row", "The tableau has all elements equal to zero", "All variables have positive coefficients in the objective function"],1,"إيه المقصود بـ 'optimality condition' في طريقة السمبلكس؟","في مسألة <b>Maximization</b>، لما <b>مايبقاش فيه أي معامل سالب في صف دالة الهدف (صف Z)</b> ده معناه إن الحل وصل للأمثل ونوقف. طول ما فيه سالب، لسه ينفع نحسّن ونعمل iteration تانية.","إتمام أول pivot مش شرط الأمثلية، والجدول عمره ما بيبقى كله أصفار."),
M("The graphical solution determines ...............",["feasible solution space", "None of them", "Optimum solution from among all the points in the solution space", "All of them"],3,"الحل البياني (graphical solution) بيحدد ...............","الطريقة البيانية بتديك الاتنين: بترسم <b>الـ feasible solution space</b> (منطقة الحلول الممكنة)، وبعدين بتختار منها <b>الحل الأمثل</b> من بين كل النقط. فالإجابة <b>All of them</b>.","الاختيار الأول والتالت كل واحد صح لوحده، بس الإجابة الشاملة هي All of them."),
M("What is a surplus variable in linear programming?",["A variable indicating unused resources", "A variable added to a ≤ constraint", "A variable subtracted from a ≥ constraint", "A variable used for unrestricted variables"],2,"إيه هو الـ surplus variable في الـ LP؟","الـ <b>surplus variable</b> بنطرحه من قيد من نوع <code>≥</code> عشان نحوّله لمعادلة، وبيمثّل الزيادة فوق الحد الأدنى المطلوب. مثال: <code>x1 + x2 ≥ 5</code> تبقى <code>x1 + x2 − s1 = 5</code>.","الموارد غير المستخدمة، والمتغير اللي بيتضاف لقيد ≤، دول وصف الـ <b>slack</b> مش الـ surplus."),
M("What is the function of sensitivity analysis in the simplex method?",["To convert inequalities to equalities", "To find new basic feasible solutions", "To solve dual problems", "To determine how changes in the coefficients affect the optimal solution"],3,"إيه وظيفة الـ sensitivity analysis في السمبلكس؟","الـ <b>sensitivity analysis</b> (تحليل الحساسية) بيدرس <b>تأثير تغيير المعاملات</b> (زي الأرباح أو الـ RHS) على الحل الأمثل: هل الحل هيفضل أمثل ولا هيتغير؟ وبنعمله بعد ما نوصل للحل الأمثل.","تحويل المتباينات لمعادلات بيتم في أول الحل (slack/surplus)، وحل الـ dual مسألة تانية خالص."),

M("When was Operations Research first formally applied?",["World War II", "Vietnam War", "Cold War", "World War I"],0,"إمتى اتطبّق الـ Operations Research رسمياً لأول مرة؟","الـ OR ظهر رسمياً في <b>الحرب العالمية التانية</b>، لما فرق علماء في بريطانيا استخدموا الأساليب الرياضية في تنظيم العمليات العسكرية (زي الرادار وتوزيع الموارد). وبعد الحرب دخل في الصناعة والإدارة.","حرب فيتنام والحرب الباردة جت بعد ظهور الـ OR، والحرب العالمية الأولى كانت قبل ظهور المصطلح."),

M("F in hexadecimal number system represents :",["14","15","10","11"],1,"الحرف F في نظام الـ hexadecimal بيمثل كام؟","الـ hexadecimal بعد 9 بيكمل بحروف: A=10, B=11, C=12, D=13, E=14, <b>F=15</b>. F هو آخر رقم في النظام (أعلى قيمة).","ملاحظة: 16 رمز كاملين من 0 لـ 15."),
M("Which of the following is the correct representation of a binary number?",["(124)2","(000)2","(115)8","(1110)8"],1,"أنهي اختيار هو تمثيل صحيح لعدد ثنائي (binary)؟","العدد الثنائي أرقامه <b>0 و 1 بس</b> وأساسه 2. <code>(000)2</code> هو الوحيد اللي أرقامه 0 و1 وأساسه 2.<br><code>(124)2</code> فيه 2 و 4 (غلط). و <code>(115)8</code> و <code>(1110)8</code> أساسهم 8 يعني octal مش binary."),
M("Which of the following number system is natural to electronic machine or devices",["NONE OF THE ABOVE","HEXADEMICAL","BINARY","OCTAL"],2,"أنهي نظام أعداد طبيعي للأجهزة الإلكترونية؟","الأجهزة الإلكترونية دوايرها ليها حالتين بس: فولت عالي أو واطي (on / off)، فبتتعامل مع <b>النظام الثنائي (binary)</b> بـ 0 و 1 بشكل طبيعي. الأنظمة التانية بنستخدمها عشان نكتب الأعداد بشكل مختصر."),
M("Perform binary subtraction on: 101111 – 010101 = ?",["011010","010101","100100"],0,"اعمل طرح ثنائي: <span dir=\"ltr\">101111 – 010101</span>","بنطرح من اليمين لليسار مع الاستلاف (borrow) لما نطرح 1 من 0:<br>الناتج <b>011010</b>.","للتأكد بالعشري: 47 – 21 = 26، و 011010 = 16 + 8 + 2 = 26 ✓"),
M("Binary subtraction of 100101 – 011110 is?",["010101","101010","000111","111000"],2,"احسب الطرح الثنائي: <span dir=\"ltr\">100101 – 011110</span>","بالطرح الثنائي مع الاستلاف الناتج <b>000111</b>.","للتأكد بالعشري: 37 – 30 = 7، و 000111 = 4 + 2 + 1 = 7 ✓"),
M("Decimal Number System Base",["2","10","16","8"],1,"إيه أساس (base) نظام الأعداد العشري؟","الـ base هو عدد الأرقام المستخدمة في النظام. العشري أساسه <b>10</b> (من 0 لـ 9).","للمقارنة: binary أساسه 2، octal أساسه 8، hexadecimal أساسه 16.")

M("Simplify using K-Map: F(x,y,z) = xyz + x'y'z + xyz'",["F = x'y'z + xy'", "F = x'y'z + xy", "F = x'y'z + x'y", "F = x'y'z' + xy"],1,"بسّط باستخدام K-Map: <span dir=\"ltr\">F(x,y,z) = xyz + x'y'z + xyz'</span>","الـ minterms: <code>xyz = 111</code> و <code>xyz' = 110</code> و <code>x'y'z = 001</code>.<br>الـ <code>110</code> و <code>111</code> متجاورين فبيتجمعوا في <code>xy</code>، و <code>001</code> بتفضل لوحدها.<br><code>F = xy + x'y'z</code>","ملاحظة: الحد الأخير في الشيت اتكتب <code>xy'z'</code> (غلط كتابة)، والمقصود <code>xyz'</code> وإلا مفيش تبسيط يطلع الإجابة دي."),
M("A·B = B·A is stated as per:",["Commutative law", "Associative law", "Distributive law", "None of the above"],0,"المعادلة <span dir=\"ltr\">A·B = B·A</span> بتمثّل أنهي قانون؟","تغيير ترتيب المتغيرات من غير ما الناتج يتغيّر هو <b>Commutative law</b> (قانون الإبدال).","الـ Associative بيتعلق بتغيير التجميع <code>(AB)C = A(BC)</code>، والـ Distributive هو <code>A(B+C) = AB + AC</code>."),
M("Simplify using K-Map: F(x,y,z) = Σ(2,3,6,7)",["F = y'", "F = x", "F = x'", "F = y"],3,"بسّط باستخدام K-Map: <span dir=\"ltr\">F(x,y,z) = Σ(2,3,6,7)</span>","الـ minterms <code>2 = 010</code> و <code>3 = 011</code> و <code>6 = 110</code> و <code>7 = 111</code>، كلهم فيهم <code>y = 1</code>.<br>بيكوّنوا مجموعة من <b>4 خانات</b> فبتتبسّط لـ <code>F = y</code>.","مجموعة الـ 4 خانات بتشيل متغيرين (x و z) وبيفضل المتغير الثابت y."),
{...M("The truth table given in fig. represents:",["AND", "OR", "NAND", "NOR"],1,"جدول الحقيقة ده بيمثّل أنهي بوابة؟","الخرج = 1 لو <b>أي مدخل</b> = 1، والخرج = 0 بس لما الاتنين 0، وده جدول <b>OR</b>.","الـ AND بيدّي 1 بس لما الاتنين 1. والـ NAND والـ NOR عكس AND و OR."),tbl:"<div class=\"tblw\"><table class=\"tbl\"><thead><tr><th>A</th><th>B</th><th>Y</th></tr></thead><tbody><tr><td>0</td><td>0</td><td>0</td></tr><tr><td>0</td><td>1</td><td>1</td></tr><tr><td>1</td><td>0</td><td>1</td></tr><tr><td>1</td><td>1</td><td>1</td></tr></tbody></table></div>"},
M("A + A'B = A + B is stated as per:",["Associative law", "None of the above", "Distributive law", "Commutative law"],1,"المعادلة <span dir=\"ltr\">A + A'B = A + B</span> بتمثّل أنهي قانون؟","دي نظرية تبسيط (<b>Redundancy / Absorption</b>) مش قانون أساسي من القوانين المذكورة، فالإجابة المعتمدة في الشيت <b>None of the above</b>.","ممكن تثبتها باستخدام الـ Distributive: <code>A + A'B = (A + A')(A + B) = A + B</code>، لكن النظرية نفسها مش اسمها Distributive law."),
M("Simplify to a minimum number of literals: F = (x+y)(x+y)'",["F = y", "F = 1", "F = x", "F = 0"],3,"بسّط لأقل عدد literals: <span dir=\"ltr\">F = (x+y)(x+y)'</span>","أي حاجة × مكمّلها = 0 (<b>Complement law</b>): <code>(x+y)·(x+y)' = 0</code>","لو كانت + بدل × كانت الإجابة 1."),

M("Simplify using K-Map: F(x,y,z) = Σ(0,2,6,7)",["F = x'y + x'z", "F = xy + x'z'", "F = x'y' + xz", "F = xy + x'z"],1,"بسّط باستخدام K-Map: <span dir=\"ltr\">F(x,y,z) = Σ(0,2,6,7)</span>","الـ <code>0 = 000</code> و <code>2 = 010</code> بيتجمعوا في <code>x'z'</code> (y بتتشال).<br>الـ <code>6 = 110</code> و <code>7 = 111</code> بيتجمعوا في <code>xy</code> (z بتتشال).<br><code>F = xy + x'z'</code>","الـ 0 والـ 2 متجاورين في الـ K-Map لأن الفرق بينهم بت واحد."),

M("The Boolean expression AB + AC' + BC simplifies to",["AB + AC + B", "AB + BC", "BC + AC'", "AB + AC'"],2,"العبارة <span dir=\"ltr\">AB + AC' + BC</span> بتتبسّط إلى:","بنظرية <b>Consensus</b>: الحدّين <code>AC'</code> و <code>BC</code> فيهم C و C'، فالحد <code>AB</code> (الإجماع بتاعهم) زيادة وبيتشال:<br><code>AB + AC' + BC = AC' + BC</code><br>تأكيد بالـ minterms: الدالة = 1 عند <code>3, 4, 6, 7</code>، و <code>BC</code> بتغطي 3 و 7، و <code>AC'</code> بتغطي 4 و 6.","تنبيه: الشيت الأصلي معلّم <code>AB + AC'</code> كإجابة، لكن ده غلط رياضياً: عند A=0,B=1,C=1 الدالة = 1 بينما <code>AB + AC'</code> = 0. فالإجابة الصح <code>BC + AC'</code>."),
];

{"q":"Which of these is correct about data mining?","o":["It is a procedure in which knowledge is mined from data.","It involves processes like Data Transformation, Data Integration, Data Cleaning.","It is a procedure using which one can extract information out of huge sets of data.","All of the above"],"a":3,"ar":"أنهي جملة صح عن الـ data mining؟","why":"كل الجمل صح: هو عملية استخراج معرفة من البيانات، وبيشمل عمليات زي الـ transformation والـ integration والـ cleaning، وبنستخرج بيه معلومات من مجموعات بيانات ضخمة. فالإجابة <b>All of the above</b>.","no":""},
{"q":"The initial steps concerned in the process of knowledge discovery is:","o":["Data Integration","Data Transformation","Data Cleaning","Knowledge presentation"],"a":0,"ar":"الخطوات الأولى في عملية اكتشاف المعرفة (knowledge discovery) هي:","why":"حسب سلايد الـ KDD عند الدكتورة: خطوة الـ <b>Data Pre-Processing</b> هي أول خطوة بعد الـ Input Data، وبتبدأ بـ <b>Data integration</b> (ثم Normalization ثم Feature selection ثم Dimension reduction). فالإجابة حسب السلايدات: <b>Data Integration</b>.","no":"ملاحظة: في بعض الشرح وكتاب Han، الـ Data Cleaning بتتذكر الأول (Cleaning ← Integration ← Reduction ← Transformation). فلو السؤال جه بصيغة الكتاب ممكن تتحسب Data Cleaning، لكن حسب سلايدات الدكتورة (والمفتاح المعتمد) الإجابة Data Integration."},

{"q":"-------------- is a property or characteristic of an object.","o":["Variable","An attribute","Record","A and B are true","A and C are true"],"a":3,"ar":"-------------- هو خاصية أو صفة للـ object.","why":"الـ <b>attribute</b> هو صفة أو خاصية للـ object (زي customer_ID أو الاسم أو العنوان)، وبيتسمى كمان <b>variable</b> أو feature أو dimension أو field. عشان كده الإجابة <b>A and B are true</b>.","no":"الـ record هو الـ object نفسه (صف كامل من الـ attributes) مش صفة ليه."},
{"q":"The following activity is a data mining Task: Predicting the future stock price of a company using historical records.","o":["true","false"],"a":0,"ar":"النشاط ده مهمة data mining: توقّع سعر سهم شركة في المستقبل باستخدام سجلات تاريخية.","why":"<b>صحيحة</b>. ده <b>prediction / regression</b>: بنتوقع قيمة مستمرة (السعر) من بيانات سابقة، وده من المهام الأساسية في الـ data mining.","no":""},

{"q":"The correct order in which all sub-processes of data mining execute is","o":["Infrastructure, Preprocessing, Knowledge presentation, data mining, evaluation","data mining, Preprocessing, evaluation, Knowledge presentation","Infrastructure, Preprocessing, data mining, evaluation, Knowledge presentation."],"a":2,"ar":"الترتيب الصح لتنفيذ العمليات الفرعية في الـ data mining هو:","why":"الترتيب المنطقي: <b>Infrastructure ← Preprocessing ← Data mining ← Evaluation ← Knowledge presentation</b>. في سلايد الـ KDD الترتيب هو: Input Data ← Pre-Processing ← Data Mining ← Post-Processing (اللي فيه pattern evaluation وvisualization). فالمهم إن الـ preprocessing قبل الـ mining، والـ evaluation والعرض بعده.","no":"الاختيارات التانية بتحط الـ data mining قبل الـ preprocessing أو الـ presentation قبل الـ evaluation، وده غلط."},

{"q":"------- Predict a value of a given continuous valued variable based on the values of other variables, assuming a linear or nonlinear model of dependency.","o":["Regression","Association Rule Discovery","Classification","Clustering"],"a":0,"ar":"------- بتتوقع قيمة متغيّر مستمر بناءً على قيم متغيّرات تانية بافتراض نموذج خطي أو غير خطي.","why":"<b>Regression</b>.","no":""},
{"q":"What are the primary ways of handling splitting based on continuous attributes in decision trees?","o":["Converting continuous attributes directly into class labels","Discretization (static/dynamic) and Binary Decisions (A < v or A >= v)","Bagging and Boosting only","Using only multi-way splits with equal frequency bucketing"],"a":1,"ar":"إيه الطرق الأساسية للتعامل مع الـ continuous attributes في الـ decision trees؟","why":"طريقتين: <b>Discretization</b> (نحوّل القيم لـ ordinal بتقسيم بـ equal interval أو equal frequency أو clustering، ثابتة أو ديناميكية) أو <b>Binary decision</b> بالشكل <code>A &lt; v</code> أو <code>A ≥ v</code> (بنختار أحسن threshold v).","no":"الـ Bagging والـ Boosting ensemble methods مش طرق split."},

{"q":"How is the Gain calculated when choosing an attribute test condition to find the best split?","o":["Gain = M - P","Gain = P + M","Gain = P - M (P is impurity before, M is weighted child impurity)","Gain = P * M"],"a":2,"ar":"إزاي بنحسب الـ Gain لما نختار attribute test condition لأحسن split؟","why":"<b>Gain = P − M</b>، حيث P هي الـ impurity <b>قبل</b> الـ split، و M هي متوسط الـ impurity للأبناء (weighted). كل ما الـ gain أكبر الـ split أحسن، لأن الـ impurity بتقل أكتر.","no":""},

/* "All Questions": كل أسئلة المادة في كويز واحد، من غير تكرار (نفس السؤال ونفس الإجابة الصح) وبنفس ترتيب الأسئلة (الاختيارات بس هي اللي بتتبدّل عشوائي) */
(function(){
  const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'');
  SUBJECTS.forEach(s=>{
    const seen=new Set(), all=[];
    s.quizzes.forEach(z=>z.questions.forEach(q=>{
      const k=q.k||(norm(q.q)+'|'+norm(q.o[q.a]));
      if(!seen.has(k)){seen.add(k);all.push(q);}
    }));
    if(all.length) s.quizzes.unshift({id:'all',all:true,title:'All Questions',questions:all});
  });
})();
function mixQs(qs,on){
  if(!on) return qs;
  const a=qs.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
const shuf = {};            // نسخة الأسئلة بعد ترتيب الاختيارات عشوائي (ثابتة طول الجلسة)
function shuffled(qs){
  return qs.map(q=>{
    const items=q.o.map((t,i)=>({t,ok:i===q.a}));
    for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]];}
    return {...q,o:items.map(x=>x.t),a:items.findIndex(x=>x.ok)};
  });
}
const saved = {};           // الإجابات بتتحفظ طول ما الصفحة مفتوحة
let st = {view:'home', sub:null, quiz:null};

function kindCount(s){
  const n=s.quizzes.filter(q=>!q.all).length; if(!n) return 'Nothing yet';
  const sh=s.quizzes.filter(q=>q.kind==='sheet').length, qz=n-sh, out=[];
  if(qz) out.push(qz+(qz>1?' quizzes':' quiz'));
  if(sh) out.push(sh+(sh>1?' sheets':' sheet'));
  return out.join(' · ');
}

/* الحروف بتهرب من الماوس وترجع مكانها */
const hm={x:-9999,y:-9999};
addEventListener('pointermove',e=>{hm.x=e.clientX;hm.y=e.clientY;});
addEventListener('pointerdown',e=>{hm.x=e.clientX;hm.y=e.clientY;});
document.addEventListener('pointerleave',()=>{hm.x=hm.y=-9999;});
const hmt=e=>{const t=e.touches[0];if(t){hm.x=t.clientX;hm.y=t.clientY;}};
addEventListener('touchstart',hmt,{passive:true});addEventListener('touchmove',hmt,{passive:true});
addEventListener('touchend',()=>{hm.x=hm.y=-9999;});addEventListener('touchcancel',()=>{hm.x=hm.y=-9999;});
addEventListener('pointerup',e=>{if(e.pointerType==='touch'){hm.x=hm.y=-9999;}});
(function loop(){
  const h=document.getElementById('hero');
  if(h&&!matchMedia('(prefers-reduced-motion:reduce)').matches){
    if(h._chars!==h.querySelectorAll('.ch').length||!h._st){h._st=[...h.querySelectorAll('.ch')].map(el=>({el,x:0,y:0,vx:0,vy:0}));h._chars=h._st.length;}
    const R=150;
    for(const c of h._st){
      const r=c.el.getBoundingClientRect(), cx=r.left+r.width/2-c.x, cy=r.top+r.height/2-c.y; // مكان الحرف الأصلي
      const px=cx+c.x, py=cy+c.y, dx=px-hm.x, dy=py-hm.y, d=Math.hypot(dx,dy);
      if(d<R){const f=(1-d/R), n=d||1; c.vx+=dx/n*f*5; c.vy+=dy/n*f*5;}
      c.vx+=-c.x*.07; c.vy+=-c.y*.07; c.vx*=.82; c.vy*=.82; c.x+=c.vx; c.y+=c.vy;
      const m=Math.min(1,Math.hypot(c.x,c.y)/60);
      if(m<.01&&Math.abs(c.vx)+Math.abs(c.vy)<.02){c.x=c.y=c.vx=c.vy=0;c.el.style.transform='';c.el.style.color='';}
      else{c.el.style.transform=`translate(${c.x.toFixed(1)}px,${c.y.toFixed(1)}px) rotate(${(c.vx*3).toFixed(1)}deg)`;
        c.el.style.color=`color-mix(in srgb,var(--accent) ${Math.round(m*100)}%,var(--ink))`;}
    }
  }
  requestAnimationFrame(loop);
})();

  app.innerHTML = bar('← Back') + `
