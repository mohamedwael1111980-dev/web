<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>quiestions</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: subject cards on a home grid -> quiz opens as a single-column question stage with a sticky progress bar */
:root{
  --bg:#eef1f5; --surface:#ffffff; --ink:#131c28; --muted:#5b6778; --line:#d6dce5;
  --accent:#2b4bff; --accent-ink:#ffffff; --accent-soft:#e3e8ff;
  --ok:#0e7a4b; --ok-soft:#dcf3e8; --bad:#b4261e; --bad-soft:#fbe4e1;
  --font-ui:'IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f151e; --surface:#18212d; --ink:#e8edf4; --muted:#93a0b3; --line:#2a3646;
  --accent:#7d93ff; --accent-ink:#0f151e; --accent-soft:#222c52;
  --ok:#52d397; --ok-soft:#14352a; --bad:#ff8a80; --bad-soft:#40201e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151e; --surface:#18212d; --ink:#e8edf4; --muted:#93a0b3; --line:#2a3646;
  --accent:#7d93ff; --accent-ink:#0f151e; --accent-soft:#222c52;
  --ok:#52d397; --ok-soft:#14352a; --bad:#ff8a80; --bad-soft:#40201e; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.7;
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto;position:relative;z-index:1}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:none}
#bg.on{display:block}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono)}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:20px 8px}
.brand{font-weight:700;font-size:15px;color:var(--muted);letter-spacing:.02em}
.back{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-size:14px;color:var(--ink)}
.back:hover{border-color:var(--accent);color:var(--accent)}

/* home */
h1{font-size:clamp(28px,6vw,40px);line-height:1.25;margin:28px 0 6px;font-weight:700;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 28px}
.subject{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:grid;gap:18px}
.subject-head{display:flex;gap:16px;align-items:center}
.sym{flex:none;width:56px;height:56px;border-radius:14px;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;font-family:var(--font-mono);font-weight:500;font-size:22px;direction:ltr}
.subject h2{margin:0;font-size:22px;line-height:1.3;direction:ltr;text-align:left}
.subject .sub{margin:0;color:var(--muted);font-size:14px}
.quizlist{display:grid;gap:10px}
.subj-btn{cursor:pointer;display:flex;align-items:center;justify-content:space-between;text-align:left;width:100%;gap:12px}
.subj-btn:hover{border-color:var(--accent)}
.subj-btn .h2{display:block;font-size:22px;font-weight:700;line-height:1.3;direction:ltr;text-align:left}
.subj-btn .sub{display:block}
#list{display:grid;gap:16px;margin-top:6px}
.qhead{margin-top:14px}
.qcard{scroll-margin-top:160px}
.quizbtn{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;width:100%;
  background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.quizbtn:hover{border-color:var(--accent)}
.quizbtn b{font-family:var(--font-mono);font-weight:500;font-size:18px;direction:ltr}
.quizbtn span{color:var(--muted);font-size:14px}
.pill{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 12px;font-size:13px;font-weight:600;white-space:nowrap}

.hero{margin:clamp(12px,5vh,48px) 0 clamp(28px,6vh,56px);text-align:center;font-size:clamp(32px,9vw,68px);line-height:1.05;font-weight:700;letter-spacing:-.02em;direction:ltr;user-select:none;cursor:default}
.hero{-webkit-tap-highlight-color:transparent;-webkit-user-select:none}
.hero .ch{display:inline-block;will-change:transform}
/* progress */
.prog{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:10px 12px;z-index:5}
.prog-top{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:8px;font-variant-numeric:tabular-nums}
.track{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.fill{height:100%;background:var(--accent);width:0;transition:width .3s}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;direction:ltr;justify-content:flex-start}
.dot{min-width:28px;height:28px;border-radius:7px;background:var(--line);color:var(--ink);border:0;padding:0;font-family:var(--font-mono);font-size:12px;font-weight:500;font-variant-numeric:tabular-nums}
.dot.ok,.dot.bad{color:#fff}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)}
.dot.cur{outline:2px solid var(--accent);outline-offset:1px}

.dm{background:none;border:1px solid var(--line);border-radius:999px;padding:0 12px;font-size:12px;line-height:22px;color:var(--ink);font-family:var(--font-mono)}
.dm:hover{border-color:var(--accent);color:var(--accent)}
.dots.row{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.dots.row .dot{flex:none}
/* question */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
#final .qcard{margin-top:16px}
.qnum{font-family:var(--font-mono);font-size:13px;color:var(--muted);direction:ltr;text-align:left;margin-bottom:8px}
.qtext{direction:ltr;text-align:left;font-size:19px;line-height:1.55;font-weight:500;margin:0 0 20px;overflow-wrap:anywhere}
.blank{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--accent);margin-inline:3px;transform:translateY(-3px)}
.opts{display:grid;gap:10px;direction:ltr}
.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--bg);
  border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:17px;overflow-wrap:anywhere}
.opt .k{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  font-family:var(--font-mono);font-size:14px;background:var(--surface);border:1px solid var(--line);font-weight:500}
.opt:not(:disabled):hover{border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.faded{opacity:.55}
.opt .mark{margin-left:auto;font-size:13px;font-weight:600;font-family:var(--font-ui)}
.opt.right .mark{color:var(--ok)} .opt.wrong .mark{color:var(--bad)}

/* explanation */
.explain{margin-top:18px;border-radius:14px;border:1px solid var(--line);background:var(--bg);overflow:hidden}
.verdict{direction:ltr;padding:12px 18px;font-weight:700;font-size:17px}
.explain.good .verdict{background:var(--ok-soft);color:var(--ok)}
.explain.miss .verdict{background:var(--bad-soft);color:var(--bad)}
.ex-body{padding:6px 18px 16px;display:grid;gap:14px;direction:rtl;text-align:right}
.ex-body h3{margin:12px 0 2px;font-size:13px;letter-spacing:.04em;color:var(--muted);font-weight:600}
.ex-body p{margin:0;max-width:62ch}
.ex-body code,.ex-body bdi{font-family:var(--font-mono);font-size:.92em;background:var(--accent-soft);color:var(--accent);padding:1px 6px;border-radius:5px;direction:ltr;unicode-bidi:isolate}
.next{margin-top:18px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:12px 22px;font-weight:600;background:var(--accent);color:var(--accent-ink);font-size:16px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn:hover{filter:brightness(1.08)}

/* result */
.score{font-family:var(--font-mono);font-size:64px;line-height:1.1;direction:ltr;font-weight:500;margin:6px 0}
.review{display:grid;gap:8px;margin-top:20px}
.rv{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.rv .n{flex:none;font-family:var(--font-mono);width:28px;height:28px;display:grid;place-items:center;border-radius:7px;color:var(--surface);font-size:13px}
.rv.ok .n{background:var(--ok)} .rv.bad .n{background:var(--bad)}
.rv span{direction:ltr;text-align:left;flex:1;min-width:0;overflow-wrap:anywhere}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
</style>

{q:"Standardization is ............... affected by outliers",o:["high","much less","None of Them","more"],a:1,

{q:"Computing the ........... corresponds to the l1 norm, noted ||.||1. This is sometimes called the Manhattan norm.",o:["RMSE","MESR","MAE","ESMR"],a:2,
 ar:"حساب الـ ........... بيقابل المعيار l1، وبيتسمى أحياناً معيار مانهاتن (Manhattan).",

{q:"To get information about dataset, in python we use..........method.",o:[".details()",".information()","None of Them",".info()"],a:3,
 ar:"للحصول على معلومات عن الـ dataset في بايثون بنستخدم الدالة ..........",
 why:"<code>.info()</code> في pandas بتعرض عدد الصفوف وأسماء الأعمدة ونوع كل عمود وعدد القيم غير الفارغة، يعني ملخص سريع لهيكل البيانات.",
 no:"<code>.details()</code> و <code>.information()</code> مش موجودين في pandas."},
{q:"The correlation coefficient ranges from ...............",o:["0 to 1","1 to 2","–1 to 1","None of Them"],a:2,
 ar:"معامل الارتباط قيمته بتتراوح من ...............",
 why:"معامل الارتباط دايماً بين <code>-1</code> و <code>+1</code>. القيمة <code>-1</code> ارتباط سلبي كامل، و <code>+1</code> ارتباط موجب كامل، و <code>0</code> يعني مفيش ارتباط خطي.",

{q:"ML algorithms don’t perform well when the input numerical attributes have very.........scales.",o:["different","Same","None of Them","Equal"],a:0,

const app = document.getElementById('app');
const L = ['A','B','C','D'];
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const blankify = s => esc(s).replace(/[.…]{3,}/g,'<span class="blank"></span>');

/* ضيف مواد أو كويزات جديدة هنا */
const SUBJECTS = [
  {id:'ml', sym:'ML', name:'Machine Learning', ar:'تعلّم الآلة',
   quizzes:[ {id:'quiz1', title:'quiz 1', questions:Q}, {id:'quiz2', title:'quiz 2', questions:Q2}, {id:'quiz3', title:'quiz 3', questions:Q3} ]},
  {id:'net', sym:'NET', name:'Network', ar:'الشبكات',
   quizzes:[ {id:'quiz1', title:'quiz 1', questions:N1} ]}
];
const saved = {};           // الإجابات بتتحفظ طول ما الصفحة مفتوحة
let st = {view:'home', sub:null, quiz:null};

function bar(backLabel){
  return `<div class="bar"><span class="brand">quiestions</span>${backLabel?`<button class="back" id="backBtn">${backLabel}</button>`:''}</div>`;
}
function go(v,sub,quiz){ window.onscroll=null; st={view:v,sub,quiz}; render(); window.scrollTo(0,0); }

/* الحروف بتهرب من الماوس وترجع مكانها */
const hm={x:-9999,y:-9999};
addEventListener('pointermove',e=>{hm.x=e.clientX;hm.y=e.clientY;});
addEventListener('pointerdown',e=>{hm.x=e.clientX;hm.y=e.clientY;});
document.addEventListener('pointerleave',()=>{hm.x=hm.y=-9999;});
const hmt=e=>{const t=e.touches[0];if(t){hm.x=t.clientX;hm.y=t.clientY;}};
addEventListener('touchstart',hmt,{passive:true});addEventListener('touchmove',hmt,{passive:true});
addEventListener('touchend',()=>{hm.x=hm.y=-9999;});addEventListener('touchcancel',()=>{hm.x=hm.y=-9999;});
addEventListener('pointerup',e=>{if(e.pointerType==='touch'){hm.x=hm.y=-9999;}});
(function loop(){
  const h=document.getElementById('hero');
  if(h&&!matchMedia('(prefers-reduced-motion:reduce)').matches){
    if(h._chars!==h.querySelectorAll('.ch').length||!h._st){h._st=[...h.querySelectorAll('.ch')].map(el=>({el,x:0,y:0,vx:0,vy:0}));h._chars=h._st.length;}
    const R=150;
    for(const c of h._st){
      const r=c.el.getBoundingClientRect(), cx=r.left+r.width/2-c.x, cy=r.top+r.height/2-c.y; // مكان الحرف الأصلي
      const px=cx+c.x, py=cy+c.y, dx=px-hm.x, dy=py-hm.y, d=Math.hypot(dx,dy);
      if(d<R){const f=(1-d/R), n=d||1; c.vx+=dx/n*f*5; c.vy+=dy/n*f*5;}
      c.vx+=-c.x*.07; c.vy+=-c.y*.07; c.vx*=.82; c.vy*=.82; c.x+=c.vx; c.y+=c.vy;
      const m=Math.min(1,Math.hypot(c.x,c.y)/60);
      if(m<.01&&Math.abs(c.vx)+Math.abs(c.vy)<.02){c.x=c.y=c.vx=c.vy=0;c.el.style.transform='';c.el.style.color='';}
      else{c.el.style.transform=`translate(${c.x.toFixed(1)}px,${c.y.toFixed(1)}px) rotate(${(c.vx*3).toFixed(1)}deg)`;
        c.el.style.color=`color-mix(in srgb,var(--accent) ${Math.round(m*100)}%,var(--ink))`;}
    }
  }
  requestAnimationFrame(loop);
})();
function home(){
  app.innerHTML = `<h1 class="hero" id="hero" aria-label="quiestions">${[...'quiestions'].map(c=>`<span class="ch" aria-hidden="true">${c}</span>`).join('')}</h1>
  <div class="quizlist">${SUBJECTS.map(s=>`
    <button class="subject subj-btn" data-sub="${s.id}">
      <span class="subject-head"><span class="sym" aria-hidden="true">${s.sym}</span>
      <span><span class="h2">${s.name}</span><span class="sub">${s.quizzes.length} quiz${s.quizzes.length>1?'zes':''}</span></span></span>
      <span class="pill">Open</span>
    </button>`).join('')}</div>`;
  document.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>go('subject',b.dataset.sub));
}

function subject(){
  const s = SUBJECTS.find(x=>x.id===st.sub);
  app.innerHTML = bar('← Back') + `
  <div class="subject-head" style="margin-top:24px"><div class="sym" aria-hidden="true">${s.sym}</div>
  <div><h1 style="margin:0;direction:ltr;text-align:left">${s.name}</h1></div></div>
  <div style="height:20px"></div>
  <div class="quizlist">${s.quizzes.map(q=>{
    const a=saved[s.id+q.id]||[]; const d=a.filter(x=>x!==undefined&&x!==null).length;
    const r=q.questions.filter((x,k)=>a[k]===x.a).length;
    return `<button class="quizbtn" data-quiz="${q.id}"><b>${q.title}</b><span>${q.questions.length} questions${d?` · ${d} answered (${r} correct)`:''}</span><span class="pill">${d?'Continue':'Start'}</span></button>`}).join('')}</div>`;
  document.getElementById('backBtn').onclick=()=>go('home');
  document.querySelectorAll('[data-quiz]').forEach(b=>b.onclick=()=>go('quiz',s.id,b.dataset.quiz));
}

function quiz(){
  const s = SUBJECTS.find(x=>x.id===st.sub), z = s.quizzes.find(x=>x.id===st.quiz), Qs = z.questions, key = s.id+z.id;
  const ans = saved[key] = saved[key] || Array(Qs.length).fill(null);
  let cur=0;
  let rowMode=false; try{rowMode=localStorage.getItem('dotsRow')==='1'}catch(e){}
  app.innerHTML = bar('← Back') + `<div class="qhead"><div class="qnum" style="margin:0">${s.name}</div><h1 style="margin:2px 0 0;direction:ltr;text-align:left">${z.title}</h1></div>
    <div class="prog"><div class="prog-top"><span id="pScore"></span><button class="dm" id="dotsMode" type="button"></button><span id="pCount"></span></div>
    <div class="track"><div class="fill" id="pFill"></div></div>
    <div class="dots" id="pDots" role="group" aria-label="Questions"></div></div>
    <div id="list"></div><div id="final"></div>`;
  document.getElementById('backBtn').onclick=()=>go('subject',s.id);

  const list = document.getElementById('list');
  Qs.forEach((q,k)=>{ const el=document.createElement('article'); el.className='qcard'; el.id='q'+k; list.appendChild(el); drawQ(k); });
  updateProg(); applyMode();

  function drawQ(k){
    const q=Qs[k], a=ans[k], done=a!==null;
    let h=`<div class="qnum">Question ${k+1} / ${Qs.length}</div><p class="qtext">${blankify(q.q)}</p><div class="opts">${q.o.map((t,i)=>{
      let c='opt'; if(done){ if(i===q.a)c+=' right'; else if(i===a)c+=' wrong'; else c+=' faded'; }
      const m=done?(i===q.a?'<span class="mark">✓ Correct</span>':(i===a?'<span class="mark">✗ Your answer</span>':'')):'';
      return `<button class="${c}" data-k="${k}" data-i="${i}" ${done?'disabled':''}><span class="k">${L[i]}</span><span>${esc(t)}</span>${m}</button>`}).join('')}</div>`;
    if(done){ const ok=a===q.a;
      h+=`<div class="explain ${ok?'good':'miss'}"><div class="verdict">${ok?'Correct':'Wrong · Answer: '+L[q.a]+' ('+esc(q.o[q.a])+')'}</div><div class="ex-body">
        <div><h3>معنى السؤال</h3><p>${q.ar}</p></div>
        <div><h3>ليه ${L[q.a]} هي الإجابة الصح؟</h3><p>${q.why}</p></div>
        ${q.no?`<div><h3>ملاحظة</h3><p>${q.no}</p></div>`:''}</div></div>`; }
    const el=document.getElementById('q'+k); el.innerHTML=h;
    el.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{ ans[k]=+b.dataset.i; drawQ(k); updateProg();
      el.querySelector('.explain').scrollIntoView({behavior:'smooth',block:'nearest'}); });
  }

  function applyMode(){
    const dd=document.getElementById('pDots'),bt=document.getElementById('dotsMode');
    dd.classList.toggle('row',rowMode); bt.textContent=rowMode?'▦ Grid':'↔ Row'; bt.setAttribute('aria-pressed',rowMode);
    const cd=dd.children[cur]; if(rowMode&&cd) dd.scrollLeft=cd.offsetLeft-dd.clientWidth/2+cd.offsetWidth/2;
  }
  document.getElementById('dotsMode').onclick=()=>{rowMode=!rowMode;try{localStorage.setItem('dotsRow',rowMode?'1':'0')}catch(e){}applyMode();};
  function setCur(k){
    cur=k;
    document.getElementById('pCount').textContent=`Question ${k+1} / ${Qs.length}`;
    document.getElementById('pFill').style.width=((k+1)/Qs.length*100)+'%';
    document.querySelectorAll('#pDots .dot').forEach((b,i)=>b.classList.toggle('cur',i===k));
    const dd=document.getElementById('pDots'),cd=dd&&dd.children[k]; if(rowMode&&cd) dd.scrollLeft=cd.offsetLeft-dd.clientWidth/2+cd.offsetWidth/2;
  }
  function onScroll(){
    const line=window.innerHeight*0.35; let k=0;
    for(let i=0;i<Qs.length;i++){ if(document.getElementById('q'+i).getBoundingClientRect().top<=line) k=i; else break; }
    if(k!==cur) setCur(k);
  }
  window.onscroll=onScroll;
  function updateProg(){
    const d=ans.filter(x=>x!==null).length, r=ans.filter((x,k)=>x===Qs[k].a).length;
    document.getElementById('pScore').textContent=`Correct: ${r} / ${d}`;
    setCur(cur);
    const dots=document.getElementById('pDots'); dots.innerHTML='';
    Qs.forEach((q,k)=>{ const b=document.createElement('button'); b.className='dot '+(ans[k]===null?'':(ans[k]===q.a?'ok':'bad'))+(k===cur?' cur':''); b.setAttribute('aria-label','Question '+(k+1)); b.textContent=k+1;
      b.onclick=()=>document.getElementById('q'+k).scrollIntoView({behavior:'smooth',block:'start'}); dots.appendChild(b); });
    const f=document.getElementById('final');
    if(d===Qs.length){ const pct=Math.round(r/Qs.length*100);
      const msg='';
      f.innerHTML=`<div class="qcard"><div class="qnum">Result</div><div class="score">${r}/${Qs.length}</div><p style="margin:0;font-weight:600">${pct}%</p>
        <div class="next"><button class="btn ghost" id="again">Retry</button><button class="btn" id="toSub">Back to ${s.name}</button></div></div>`;
      document.getElementById('again').onclick=()=>{saved[key]=null;go('quiz',s.id,z.id)};
      document.getElementById('toSub').onclick=()=>go('subject',s.id);
    } else f.innerHTML='';
  }
}


/* خلفية تفاعلية للصفحة الرئيسية: شبكة نقاط (زي شبكة عصبية) بتتفاعل مع الماوس */
const bg=(()=>{
  const cv=document.getElementById('bg'), cx=cv.getContext('2d');
  let W=0,H=0,dpr=1,pts=[],raf=0,on=false,col={a:'#2b4bff',l:'#d6dce5'};
  const m={x:-9999,y:-9999,in:false};
  const still=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
  function colors(){const cs=getComputedStyle(document.documentElement);col.a=cs.getPropertyValue('--accent').trim()||col.a;col.l=cs.getPropertyValue('--muted').trim()||col.l;}
  function rgba(hex,al){let h=hex.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);if(isNaN(n))return hex;return `rgba(${n>>16&255},${n>>8&255},${n&255},${al})`;}
  function size(){dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.round(Math.min(110,Math.max(35,W*H/14000)));
    while(pts.length<n)pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,r:1.4+Math.random()*1.8});
    pts.length=n;}
  function frame(){
    cx.clearRect(0,0,W,H);
    const LINK=130,MR=160;
    for(const p of pts){
      const dx=p.x-m.x,dy=p.y-m.y,d=Math.hypot(dx,dy);
      if(m.in&&d<MR&&d>0){const f=(1-d/MR)*.9;p.vx+=dx/d*f*.12;p.vy+=dy/d*f*.12;}
      p.vx*=.985;p.vy*=.985;
      const sp=Math.hypot(p.vx,p.vy); if(sp<.12){p.vx+=(Math.random()-.5)*.02;p.vy+=(Math.random()-.5)*.02;}
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<-10)p.x=W+10;else if(p.x>W+10)p.x=-10;
      if(p.y<-10)p.y=H+10;else if(p.y>H+10)p.y=-10;
    }
    cx.lineWidth=1;
    for(let i=0;i<pts.length;i++){const a=pts[i];
      for(let j=i+1;j<pts.length;j++){const b=pts[j],d=Math.hypot(a.x-b.x,a.y-b.y);
        if(d<LINK){cx.strokeStyle=rgba(col.l,(1-d/LINK)*.35);cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke();}}
      if(m.in){const d=Math.hypot(a.x-m.x,a.y-m.y);
        if(d<MR*1.3){cx.strokeStyle=rgba(col.a,(1-d/(MR*1.3))*.75);cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(m.x,m.y);cx.stroke();}}
    }
    for(const p of pts){const d=m.in?Math.hypot(p.x-m.x,p.y-m.y):999,near=d<MR*1.3;
      cx.fillStyle=near?rgba(col.a,.95):rgba(col.l,.55);
      cx.beginPath();cx.arc(p.x,p.y,p.r+(near?1:0),0,6.283);cx.fill();}
    if(m.in){const g=cx.createRadialGradient(m.x,m.y,0,m.x,m.y,MR*1.4);g.addColorStop(0,rgba(col.a,.14));g.addColorStop(1,rgba(col.a,0));cx.fillStyle=g;cx.fillRect(m.x-MR*1.4,m.y-MR*1.4,MR*2.8,MR*2.8);}
    raf=still?0:requestAnimationFrame(frame);
  }
  addEventListener('pointermove',e=>{m.x=e.clientX;m.y=e.clientY;m.in=true;if(still&&on)frame();});
  const tpt=e=>{const t=e.touches[0];if(!t)return;m.x=t.clientX;m.y=t.clientY;m.in=true;if(still&&on)frame();};
  addEventListener('touchstart',tpt,{passive:true});addEventListener('touchmove',tpt,{passive:true});
  addEventListener('touchend',()=>{m.in=false});addEventListener('touchcancel',()=>{m.in=false});
  addEventListener('pointerdown',e=>{m.x=e.clientX;m.y=e.clientY;m.in=true;
    for(const p of pts){const dx=p.x-m.x,dy=p.y-m.y,d=Math.hypot(dx,dy);if(d<220&&d>0){p.vx+=dx/d*3;p.vy+=dy/d*3;}}});
  document.addEventListener('pointerleave',()=>{m.in=false});
  addEventListener('pointerup',e=>{if(e.pointerType==='touch')m.in=false;});
  addEventListener('resize',()=>{if(on)size();});
  return {
    start(){if(on)return;on=true;colors();size();cv.classList.add('on');cancelAnimationFrame(raf);frame();},
    stop(){on=false;cancelAnimationFrame(raf);cv.classList.remove('on');}
  };
})();
function render(){ ({home,subject,quiz})[st.view](); if(st.view==='home')bg.start(); else bg.stop(); }
document.documentElement.lang='en'; document.documentElement.dir='ltr';
render();
</script>
